# ════════════════════════════════════════════════════════════════════════════
#  Gradle Proje Ayarları
# ════════════════════════════════════════════════════════════════════════════

# JVM bellek ayarları — derleme hızı için optimize edilmiştir
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Paralel derleme (bağımsız projelerde)
org.gradle.parallel=true

# Gradle daemon aktif (CI dışında hız kazandırır)
org.gradle.daemon=true

# Configuration cache — tekrarlanan derlemeleri hızlandırır
org.gradle.configuration-cache=false

# AndroidX kullanımı zorunlu
android.useAndroidX=true

# R sınıfı namespace yalıtımı
android.nonTransitiveRClass=true

# Kotlin kaydı kapat (performans)
kotlin.stdlib.default.dependency=false

# Unix satır sonları (CI'da tutarlılık)
systemProp.line.separator=\n
