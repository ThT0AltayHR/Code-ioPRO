# ════════════════════════════════════════════════════════════════════════════
#  Gradle Proje Ayarları — Build 15
# ════════════════════════════════════════════════════════════════════════════

# JVM bellek ayarları — AGP 8.7 için optimize
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Paralel derleme
org.gradle.parallel=true

# Gradle daemon
org.gradle.daemon=true

# Configuration cache devre dışı (AGP 8.7 uyumu)
org.gradle.configuration-cache=false

# AndroidX zorunlu
android.useAndroidX=true

# R sınıfı namespace yalıtımı
android.nonTransitiveRClass=true

# Kotlin stdlib (pure Java projesi, kapalı kalabilir)
kotlin.stdlib.default.dependency=false

# Unix satır sonları
systemProp.line.separator=\n
