plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'com.codeioPRO.app'
    android.buildFeatures.buildConfig true

    defaultConfig {
        applicationId "com.codeioPRO.app"
        minSdk 31
        targetSdk 35
        versionCode 20
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            def envKey   = System.getenv("SIGNING_KEY_STORE_PATH")
            def envSP    = System.getenv("SIGNING_STORE_PASSWORD")
            def envAlias = System.getenv("SIGNING_KEY_ALIAS")
            def envKP    = System.getenv("SIGNING_KEY_PASSWORD")

            if (envKey != null && new File(envKey).exists()) {
                storeFile     = file(envKey)
                storePassword = envSP ?: ""
                keyAlias      = envAlias ?: "release"
                keyPassword   = envKP ?: ""
            } else {
                def localProp = new Properties()
                def localFile = rootProject.file('local.properties')
                if (localFile.exists()) {
                    localFile.withInputStream { localProp.load(it) }
                }
                def sf = localProp.getProperty('signing.storeFile')
                if (sf != null) {
                    storeFile     = file(sf)
                    storePassword = localProp.getProperty('signing.storePassword', '')
                    keyAlias      = localProp.getProperty('signing.keyAlias', 'release')
                    keyPassword   = localProp.getProperty('signing.keyPassword', '')
                }
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def releaseSigning = signingConfigs.findByName('release')
            if (releaseSigning != null && releaseSigning.storeFile != null) {
                signingConfig releaseSigning
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packaging {
        resources {
            excludes += '/assets/dexopt/baseline.prof'
            excludes += '/assets/dexopt/baseline.profm'
            excludes += 'META-INF/LICENSE.md'
            excludes += 'META-INF/LICENSE-notice.md'
            excludes += 'META-INF/DEPENDENCIES'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        disable "MissingTranslation"
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    def lifecycle_version = "2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-common:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-process:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-viewmodel:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-livedata:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-common-java8:${lifecycle_version}"

    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'org.json:json:20240303'
    implementation 'androidx.preference:preference:1.2.1'
}
