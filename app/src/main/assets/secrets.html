<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SECRETS — Code-ioPRO</title>
<style>
:root{
  --bg:#0E1525;--card:#131D2E;--card2:#1A2540;
  --accent:#00D4FF;--green:#00FF88;--red:#FF4B4B;--yellow:#FFD740;--purple:#7C4DFF;
  --txt:#fff;--txt2:#8892A4;--border:#1E2A40;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}
.header{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.header-icon{width:28px;height:28px;color:var(--accent);}
.header-title{flex:1;font-size:17px;font-weight:700;color:var(--accent);}
.lock-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--txt2);border-radius:8px;padding:6px 12px;
  font-size:12px;cursor:pointer;
}
.lock-btn:active{background:var(--border);}
.section{padding:16px 16px 0;}
.section-title{
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--accent);margin-bottom:10px;
}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin-bottom:12px;
}
.key-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--border);
}
.key-row:last-child{border-bottom:none;}
.key-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--red);flex-shrink:0;
}
.key-dot.has{background:var(--green);}
.key-info{flex:1;min-width:0;}
.key-name{font-size:13px;font-weight:600;color:var(--txt);font-family:monospace;}
.key-desc{font-size:11px;color:var(--txt2);margin-top:1px;}
.key-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-sm{
  background:var(--card2);border:1px solid var(--border);
  color:var(--txt2);border-radius:6px;padding:4px 10px;
  font-size:11px;cursor:pointer;
}
.btn-sm.accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.btn-sm.red{background:var(--red);color:#fff;border-color:var(--red);}
.btn-sm:active{opacity:.7;}
/* Add/Edit modal */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);z-index:100;
  align-items:flex-end;
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--card);border-radius:16px 16px 0 0;
  padding:20px 16px 32px;width:100%;
  animation:slideUp .25s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--accent);}
.input-group{margin-bottom:14px;}
.input-label{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:6px;display:block;}
input,textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;color:var(--txt);font-size:13px;
  font-family:monospace;outline:none;-webkit-appearance:none;
}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{height:80px;resize:none;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn-modal{
  flex:1;padding:12px;border-radius:10px;border:none;
  font-size:14px;font-weight:700;cursor:pointer;
}
.btn-modal.primary{background:var(--accent);color:#000;}
.btn-modal.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--border);}
.btn-modal:active{opacity:.8;}
/* Lock screen */
#lock-screen{
  display:none;position:fixed;inset:0;
  background:var(--bg);z-index:200;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
.lock-icon{font-size:64px;}
.lock-msg{font-size:16px;color:var(--txt2);text-align:center;}
.empty-state{
  text-align:center;padding:40px 20px;color:var(--txt2);font-size:13px;
}
/* Custom vars section */
.add-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-top:1px solid var(--border);
}
.add-row input{flex:1;}
.badge{
  background:var(--green);color:#000;border-radius:4px;
  padding:1px 6px;font-size:10px;font-weight:700;margin-left:4px;
}
</style>
</head>
<body>

<div class="header">
  <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor">
    <path d="M18,8H17V6C17,3.24 14.76,1 12,1C9.24,1 7,3.24 7,6V8H6C4.9,8 4,8.9 4,10V20C4,21.1 4.9,22 6,22H18C19.1,22 20,21.1 20,20V10C20,8.9 19.1,8 18,8ZM12,17C10.9,17 10,16.1 10,15C10,13.9 10.9,13 12,13C13.1,13 14,13.9 14,15C14,16.1 13.1,17 12,17ZM15.1,8H8.9V6C8.9,4.29 10.29,2.9 12,2.9C13.71,2.9 15.1,4.29 15.1,6V8Z"/>
  </svg>
  <span class="header-title">SECRETS</span>
  <button class="lock-btn" onclick="lockSecrets()">🔒 Kilitle</button>
</div>

<div id="content">

<div class="section">
  <div class="section-title">API Anahtarları</div>
  <div class="card" id="api-keys-card">
    <!-- populated by JS -->
  </div>
</div>

<div class="section">
  <div class="section-title">Özel Değişkenler</div>
  <div class="card" id="custom-vars-card">
    <div id="custom-vars-list"></div>
    <div class="add-row">
      <input id="new-key-input" type="text" placeholder="KEY_ADI" style="width:38%;font-size:12px;">
      <input id="new-val-input" type="text" placeholder="değer">
      <button class="btn-sm accent" onclick="addCustomVar()">+ Ekle</button>
    </div>
  </div>
</div>

<div class="section" style="padding-bottom:24px;">
  <div class="section-title">Tehlike Bölgesi</div>
  <div class="card">
    <div class="key-row">
      <div class="key-info">
        <div class="key-name">Tüm Veriyi Sil</div>
        <div class="key-desc">Tüm API anahtarları, ayarlar ve geçmiş</div>
      </div>
      <button class="btn-sm red" onclick="clearAll()">Sil</button>
    </div>
  </div>
</div>

</div><!-- /content -->

<!-- Lock screen -->
<div id="lock-screen">
  <div class="lock-icon">🔒</div>
  <div class="lock-msg">SECRETS kilitli<br>Lütfen kimlik doğrulayın</div>
</div>

<!-- Edit modal -->
<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">API Anahtarı Ekle</div>
    <div class="input-group">
      <label class="input-label" id="modal-key-label">Anahtar Adı</label>
      <input id="modal-key" type="text" readonly>
    </div>
    <div class="input-group">
      <label class="input-label">Değer</label>
      <input id="modal-val" type="password" placeholder="••••••••••••">
    </div>
    <div class="input-group">
      <label class="input-label" id="modal-hint-label" style="color:#8892A4;font-size:11px;"></label>
    </div>
    <div class="modal-actions">
      <button class="btn-modal secondary" onclick="closeModal()">İptal</button>
      <button class="btn-modal primary" onclick="saveModal()">Kaydet</button>
    </div>
  </div>
</div>

<script>
var API_KEYS = [
  {id:'openai_api_key',    name:'OpenAI API Key',   desc:'GPT-4o, o1 modelleri', hint:'platform.openai.com/api-keys'},
  {id:'claude_api_key',    name:'Anthropic Claude', desc:'Claude 3.5 Sonnet, Haiku', hint:'console.anthropic.com/settings/keys'},
  {id:'gemini_api_key',    name:'Google Gemini',    desc:'Gemini 1.5 Pro, Flash', hint:'aistudio.google.com/app/apikey'},
  {id:'groq_api_key',      name:'Groq',             desc:'Llama, Mixtral — ücretsiz!', hint:'console.groq.com/keys'},
  {id:'mistral_api_key',   name:'Mistral AI',       desc:'Mistral Large, Codestral', hint:'console.mistral.ai/api-keys'},
  {id:'openrouter_api_key',name:'OpenRouter',       desc:'200+ model — tek API', hint:'openrouter.ai/keys'},
  {id:'together_api_key',  name:'Together AI',      desc:'Açık kaynak modeller', hint:'api.together.ai/settings/api-keys'},
  {id:'deepseek_api_key',  name:'DeepSeek',         desc:'DeepSeek R1, V3 — kod odaklı', hint:'platform.deepseek.com/api_keys'},
  {id:'perplexity_api_key',name:'Perplexity',       desc:'Sonar — web aramalı AI', hint:'perplexity.ai/settings/api'},
  {id:'github_token',      name:'GitHub Token',     desc:'Repo push/pull işlemleri', hint:'github.com/settings/tokens'},
  {id:'custom_api_key',    name:'Özel API Key',     desc:'Kendi endpoint\'in için', hint:''},
];

var currentData = {};
var editingKey  = null;

window.loadSecrets = function(data){
  currentData = data || {};
  renderApiKeys();
  renderCustomVars();
};

function renderApiKeys(){
  var el = document.getElementById('api-keys-card');
  el.innerHTML = '';
  API_KEYS.forEach(function(k){
    var has = !!currentData[k.id];
    var row = document.createElement('div');
    row.className = 'key-row';
    row.innerHTML =
      '<div class="key-dot ' + (has?'has':'') + '"></div>' +
      '<div class="key-info"><div class="key-name">' + k.name + (has?'<span class="badge">✓ Aktif</span>':'') + '</div><div class="key-desc">' + k.desc + '</div></div>' +
      '<div class="key-actions">' +
        '<button class="btn-sm accent" onclick="openModal(\'' + k.id + '\')">' + (has ? '✏️ Düzenle' : '+ Ekle') + '</button>' +
        (has ? '<button class="btn-sm red" onclick="delKey(\'' + k.id + '\')">✕</button>' : '') +
      '</div>';
    el.appendChild(row);
  });
}

function renderCustomVars(){
  var el = document.getElementById('custom-vars-list');
  el.innerHTML = '';
  var customKeys = Object.keys(currentData).filter(function(k){
    return !API_KEYS.some(function(a){return a.id===k;});
  });
  if(customKeys.length === 0){
    el.innerHTML = '<div class="empty-state">Henüz özel değişken yok</div>';
    return;
  }
  customKeys.forEach(function(k){
    var row = document.createElement('div');
    row.className = 'key-row';
    row.innerHTML =
      '<div class="key-dot has"></div>' +
      '<div class="key-info"><div class="key-name">' + k + '</div><div class="key-desc">••••••••</div></div>' +
      '<div class="key-actions"><button class="btn-sm red" onclick="delKey(\'' + k + '\')">✕</button></div>';
    el.appendChild(row);
  });
}

function openModal(keyId){
  editingKey = keyId;
  var meta = API_KEYS.find(function(k){return k.id === keyId;});
  document.getElementById('modal-title').textContent = meta ? meta.name + ' Ayarla' : 'Anahtar Ekle';
  document.getElementById('modal-key').value = keyId;
  document.getElementById('modal-val').value = '';
  document.getElementById('modal-val').type = 'password';
  document.getElementById('modal-hint-label').textContent = meta && meta.hint ? '🔗 ' + meta.hint : '';
  document.getElementById('edit-modal').classList.add('open');
}

function closeModal(){
  document.getElementById('edit-modal').classList.remove('open');
  editingKey = null;
}

function saveModal(){
  var k = document.getElementById('modal-key').value;
  var v = document.getElementById('modal-val').value;
  if(!k || !v) return;
  if(typeof AndroidSecrets !== 'undefined') AndroidSecrets.saveSecret(k, v);
  currentData[k] = '****';
  renderApiKeys();
  renderCustomVars();
  closeModal();
}

function delKey(k){
  if(typeof AndroidSecrets !== 'undefined') AndroidSecrets.deleteSecret(k);
  delete currentData[k];
  renderApiKeys();
  renderCustomVars();
}

function addCustomVar(){
  var k = document.getElementById('new-key-input').value.trim();
  var v = document.getElementById('new-val-input').value.trim();
  if(!k || !v) return;
  if(typeof AndroidSecrets !== 'undefined') AndroidSecrets.saveSecret(k, v);
  currentData[k] = '****';
  document.getElementById('new-key-input').value = '';
  document.getElementById('new-val-input').value = '';
  renderCustomVars();
}

function clearAll(){
  if(typeof AndroidSecrets !== 'undefined') AndroidSecrets.clearAll();
}

function lockSecrets(){
  if(typeof AndroidSecrets !== 'undefined') AndroidSecrets.lock();
}

window.showLockScreen = function(){
  document.getElementById('lock-screen').style.display = 'flex';
};
</script>
</body>
</html>
