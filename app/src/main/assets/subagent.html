<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Agent Sistemi</title>
<style>
:root{--bg:#0E1525;--card:#131D2E;--card2:#1A2540;--accent:#00D4FF;--green:#00FF88;--red:#FF4B4B;--yellow:#FFD740;--purple:#7C4DFF;--orange:#FF8C00;--txt:#fff;--txt2:#8892A4;--border:#1E2A40}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:20px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-title{font-size:18px;font-weight:700}
.brain-mini{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.3s;cursor:pointer}
.brain-mini.active{border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.4);animation:brainPulse 1.5s ease-in-out infinite}
@keyframes brainPulse{0%,100%{box-shadow:0 0 6px rgba(0,212,255,.3)}50%{box-shadow:0 0 20px rgba(0,212,255,.7)}}

/* Input panel */
.input-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:16px;padding:16px}
.input-label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.project-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--txt);font-size:14px;padding:12px;resize:none;outline:none;min-height:80px;font-family:inherit;transition:.2s}
.project-input:focus{border-color:var(--accent)}
.project-input::placeholder{color:var(--txt2)}
.controls{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.model-select{flex:1;min-width:0;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:13px;outline:none;cursor:pointer}
.mode-toggle{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mode-btn{padding:8px 14px;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:.2s;color:var(--txt2);background:transparent}
.mode-btn.active{background:var(--accent);color:#000}
.dispatch-btn{background:linear-gradient(135deg,var(--accent),#0099BB);color:#000;border:none;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0;transition:.15s}
.dispatch-btn:active{transform:scale(.95)}

/* Stats bar */
.stats-bar{display:flex;gap:4px;padding:0 16px 16px}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:10px;color:var(--txt2);margin-top:2px}

/* Sessions */
.sessions-title{font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;padding:0 16px 10px}
.session-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:0 16px 12px;overflow:hidden;transition:.2s}
.session-card.running{border-color:var(--accent)}
.session-card.error{border-color:var(--red)}
.session-card.done{border-color:var(--green)}

.session-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.agent-role{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.role-main{background:rgba(0,212,255,.15);color:var(--accent)}
.role-code{background:rgba(0,255,136,.12);color:var(--green)}
.role-fix{background:rgba(255,140,0,.12);color:var(--orange)}
.role-ui{background:rgba(124,77,255,.15);color:var(--purple)}
.role-sec{background:rgba(255,75,75,.12);color:var(--red)}

.session-model{font-size:11px;color:var(--txt2);flex:1}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-running{background:var(--green);animation:dotPulse 1s ease-in-out infinite}
.dot-waiting{background:var(--yellow)}
.dot-idle,.dot-stopped{background:#555}
.dot-done{background:var(--green)}
.dot-error{background:var(--red)}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.3}}

.session-task{font-size:12px;color:var(--txt2);padding:0 14px 8px;border-top:1px solid var(--border);padding-top:8px}
.session-files{font-size:11px;color:var(--accent);padding:0 14px 4px}
.expand-arrow{transition:transform .2s;font-size:12px;color:var(--txt2)}
.expanded .expand-arrow{transform:rotate(180deg)}

/* Logs */
.session-logs{display:none;background:var(--card2);border-top:1px solid var(--border);padding:10px 14px;max-height:180px;overflow-y:auto}
.session-card.expanded .session-logs{display:block}
.log-entry{font-size:11px;color:var(--txt2);padding:2px 0;font-family:monospace;line-height:1.5}

/* Empty state */
.empty-state{text-align:center;padding:60px 32px}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-title{font-size:18px;font-weight:700;color:var(--txt2);margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--txt2);opacity:.7;line-height:1.6}

/* Stop button */
.stop-btn{background:rgba(255,75,75,.15);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:calc(100% - 32px);margin:0 16px 16px;display:none;transition:.15s}
.stop-btn:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="header">
  <span class="header-title">🤖 Agent Sistemi</span>
  <div class="brain-mini" id="brainMini">🧠</div>
</div>

<div class="input-panel">
  <div class="input-label">Proje Açıklaması</div>
  <textarea class="project-input" id="projectInput" placeholder="Projeyi açıklayın... (örn: Hava durumu gösteren bir Android uygulaması yap)" rows="3"></textarea>
  <div class="controls">
    <select class="model-select" id="modelSelect">
      <option value="gpt-4o-mini">GPT-5.4 nano (Önerilen)</option>
      <option value="gpt-4o">GPT-5.4 mini</option>
      <option value="claude-3-5-haiku-20241022">Claude Haiku 4.5</option>
      <option value="claude-3-5-sonnet-20241022">Claude Sonnet 3.5</option>
      <option value="mistral-small">Mistral Small 4</option>
      <option value="gemma-2-27b-it">Gemma 4 31B</option>
      <option value="meta-llama/llama-3.1-405b">LLaMA 3.1 405B</option>
    </select>
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeEconomy" onclick="setMode('economy')">🌿 Economy</button>
      <button class="mode-btn" id="modePower" onclick="setMode('power')">⚡ Power</button>
    </div>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px">
    <button class="dispatch-btn" style="flex:1" onclick="dispatch()">🚀 Agent Başlat</button>
  </div>
</div>

<div class="stats-bar" id="statsBar" style="display:none">
  <div class="stat"><div class="stat-val" id="statAgents">0</div><div class="stat-lbl">Agent</div></div>
  <div class="stat"><div class="stat-val" id="statFiles">0</div><div class="stat-lbl">Dosya</div></div>
  <div class="stat"><div class="stat-val" id="statStatus">—</div><div class="stat-lbl">Durum</div></div>
</div>

<button class="stop-btn" id="stopBtn" onclick="stopAll()">⏹ Tüm Agentları Durdur</button>

<div id="sessionsContainer">
  <div class="empty-state">
    <div class="empty-icon">🤖</div>
    <div class="empty-title">Henüz agent çalışmıyor</div>
    <div class="empty-desc">Projenizi açıklayın ve Agent Başlat'a basın.<br>Yapay zeka otomatik olarak uygun sayıda<br>ve modelde agent devreye alır.</div>
  </div>
</div>

<script>
var currentMode='economy';
var sessions=[];

function setMode(m){
  currentMode=m;
  document.getElementById('modeEconomy').className='mode-btn'+(m==='economy'?' active':'');
  document.getElementById('modePower').className='mode-btn'+(m==='power'?' active':'');
  if(typeof AgentBridge!='undefined')AgentBridge.setMode(m);
}

function dispatch(){
  var desc=document.getElementById('projectInput').value.trim();
  if(!desc){alert('Lütfen proje açıklaması girin');return;}
  var model=document.getElementById('modelSelect').value;
  if(typeof AgentBridge!='undefined'){
    AgentBridge.dispatchProject(desc,model,currentMode);
  } else {
    // Demo mode
    simulateAgents(desc,model,currentMode);
  }
}

function stopAll(){
  if(typeof AgentBridge!='undefined')AgentBridge.stopAllAgents();
}

function getRoleClass(role){
  if(role.includes('Ana'))return 'role-main';
  if(role.includes('Kod'))return 'role-code';
  if(role.includes('Fix')||role.includes('Test'))return 'role-fix';
  if(role.includes('UI'))return 'role-ui';
  return 'role-sec';
}

function updateSessions(data){
  sessions=typeof data==='string'?JSON.parse(data):data;
  renderSessions();
}

function renderSessions(){
  var c=document.getElementById('sessionsContainer');
  if(!sessions||sessions.length===0){
    c.innerHTML='<div class="empty-state"><div class="empty-icon">🤖</div><div class="empty-title">Henüz agent çalışmıyor</div><div class="empty-desc">Projenizi açıklayın ve Agent Başlat\'a basın.</div></div>';
    document.getElementById('statsBar').style.display='none';
    document.getElementById('stopBtn').style.display='none';
    document.getElementById('brainMini').className='brain-mini';
    return;
  }

  var hasRunning=sessions.some(function(s){return s.status==='running';});
  document.getElementById('brainMini').className='brain-mini'+(hasRunning?' active':'');
  document.getElementById('statsBar').style.display='flex';
  document.getElementById('stopBtn').style.display=hasRunning?'block':'none';

  var totalFiles=sessions.reduce(function(a,s){return a+s.filesCreated;},0);
  document.getElementById('statAgents').textContent=sessions.length;
  document.getElementById('statFiles').textContent=totalFiles;
  document.getElementById('statStatus').textContent=hasRunning?'Çalışıyor':'Tamamlandı';

  c.innerHTML='<div class="sessions-title">Aktif Agentlar</div>';
  sessions.forEach(function(s,i){
    var expanded=false;
    var statusClass='dot-'+(s.status||'idle');
    var roleClass=getRoleClass(s.role||'');
    var logsHtml=(s.logs||[]).map(function(l){
      return '<div class="log-entry">'+l+'</div>';
    }).join('');

    var card=document.createElement('div');
    card.className='session-card '+(s.status||'idle');
    card.innerHTML=
      '<div class="session-header" onclick="toggleLogs(this)">' +
        '<span class="agent-role '+roleClass+'">'+s.role+'</span>' +
        '<span class="session-model">'+s.model+'</span>' +
        '<div class="status-dot '+statusClass+'"></div>' +
        '<span class="expand-arrow">▼</span>' +
      '</div>' +
      '<div class="session-task">'+s.currentTask+'</div>' +
      (s.filesCreated?'<div class="session-files">📁 '+s.filesCreated+' dosya oluşturuldu</div>':'') +
      '<div class="session-logs">' + (logsHtml||'<div class="log-entry" style="color:#555">Henüz log yok...</div>') + '</div>';
    c.appendChild(card);
  });
}

function toggleLogs(header){
  var card=header.parentElement;
  card.classList.toggle('expanded');
}

window.initAgentUI=function(model,mode,sessionsJson){
  if(model&&document.getElementById('modelSelect'))
    document.getElementById('modelSelect').value=model;
  if(mode)setMode(mode);
  if(sessionsJson)updateSessions(sessionsJson);
};
window.updateSessions=updateSessions;

// Demo simulation
function simulateAgents(desc,model,mode){
  var count=desc.split(' ').length<20?2:3;
  sessions=[
    {id:'a1',role:'Ana Agent (Orkestra)',model:model,status:'planning',currentTask:'Proje analiz ediliyor...',filesCreated:0,logs:['📋 Proje alındı']},
    {id:'a2',role:'Kod Yazıcı',model:'gpt-4o-mini',status:'waiting',currentTask:'Ana agent bekleniyor...',filesCreated:0,logs:[]}
  ];
  if(count>2)sessions.push({id:'a3',role:'Test & Fix',model:'gemma-2-27b-it',status:'waiting',currentTask:'Hazır',filesCreated:0,logs:[]});
  renderSessions();
  setTimeout(function(){
    sessions[0].status='running';sessions[0].currentTask='Sistem promptu yazılıyor';
    sessions[0].logs.push('🧠 Prompt oluşturuluyor...');renderSessions();
  },800);
  setTimeout(function(){
    sessions[1].status='running';sessions[1].logs.push('🚀 Göreve başlandı');renderSessions();
  },2000);
}
</script>
</body>
</html>
