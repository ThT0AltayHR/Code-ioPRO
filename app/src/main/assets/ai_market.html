<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Marketi — Code-ioPRO</title>
<style>
:root{
  --bg:#0E1019;--card:#141824;--card2:#1C2232;
  --accent:#F26207;--green:#00D26A;--red:#FF4444;--yellow:#F5B731;--purple:#8A63D2;--blue:#0EA5E9;
  --txt:#F0F2F5;--txt2:#7E8A9E;--border:#252E42;--input:#0B0F1A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}

/* Search bar */
.search-wrap{
  padding:12px 16px;background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
  display:flex;flex-direction:column;gap:10px;
}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--input);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;
}
.search-box input{
  flex:1;background:none;border:none;color:var(--txt);font-size:13px;outline:none;
}
.search-box svg{width:16px;height:16px;opacity:.5;}

/* Filter chips */
.filter-bar{
  display:flex;overflow-x:auto;gap:8px;
}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{
  background:var(--card2);border:1px solid var(--border);
  color:var(--txt2);border-radius:20px;padding:5px 12px;
  font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0;
  transition:.15s;
}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.filter-chip:active{opacity:.7;}

/* Provider grid */
.providers-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;padding:14px;
}
.provider-card{
  background:var(--card);border:2px solid var(--border);
  border-radius:16px;overflow:hidden;cursor:pointer;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.provider-card.active{border-color:var(--accent);box-shadow:0 0 12px rgba(242,98,7,.2);}
.provider-card:active{transform:scale(.96);}

/* Logo area — real styled logos */
.provider-logo{
  height:62px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.logo-openai{ background:linear-gradient(135deg,#000 0%,#111 100%); }
.logo-anthropic{ background:linear-gradient(135deg,#1A0E00 0%,#2D1A00 100%); }
.logo-gemini{ background:linear-gradient(135deg,#0D1B4A 0%,#1A2E70 100%); }
.logo-groq{ background:linear-gradient(135deg,#0A0A14 0%,#12122A 100%); }
.logo-mistral{ background:linear-gradient(135deg,#0E1A0A 0%,#182A14 100%); }
.logo-cohere{ background:linear-gradient(135deg,#1A0A1A 0%,#2E0A2E 100%); }
.logo-openrouter{ background:linear-gradient(135deg,#0A0E14 0%,#101828 100%); }
.logo-together{ background:linear-gradient(135deg,#0E0A00 0%,#1E1400 100%); }
.logo-perplexity{ background:linear-gradient(135deg,#000A0E 0%,#001418 100%); }
.logo-deepseek{ background:linear-gradient(135deg,#00060E 0%,#001020 100%); }
.logo-custom{ background:linear-gradient(135deg,#0A0E1A 0%,#101828 100%); }

/* Text logo styles */
.logo-text{
  font-size:15px;font-weight:900;letter-spacing:-0.5px;
  text-align:center;user-select:none;
}
.logo-text-openai{ color:#fff; font-family:sans-serif; }
.logo-text-anthropic{ color:#CC785C; font-family:Georgia,serif; }
.logo-text-gemini{ background:linear-gradient(90deg,#4285F4,#EA4335,#FBBC05,#34A853); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-family:sans-serif; }
.logo-text-groq{ color:#F55036; font-family:monospace; font-size:18px; }
.logo-text-mistral{ color:#FA520F; font-family:sans-serif; }
.logo-text-cohere{ color:#39594D; font-family:sans-serif; color:#C3E88D; }
.logo-text-openrouter{ color:#6366F1; font-family:monospace; }
.logo-text-together{ color:#F5B731; font-family:sans-serif; }
.logo-text-perplexity{ color:#20B2AA; font-family:sans-serif; }
.logo-text-deepseek{ color:#4DA6FF; font-family:sans-serif; }
.logo-text-custom{ color:var(--txt2); font-family:monospace; }

.provider-body{padding:8px 10px 12px;}
.provider-name{font-size:12px;font-weight:700;color:var(--txt);text-align:center;}
.provider-desc{font-size:10px;color:var(--txt2);text-align:center;margin-top:2px;line-height:1.3;}
.provider-badges{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap;}
.badge{border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;}
.badge.free{background:rgba(0,210,106,.15);color:var(--green);border:1px solid rgba(0,210,106,.3);}
.badge.paid{background:rgba(245,183,49,.1);color:var(--yellow);border:1px solid rgba(245,183,49,.25);}
.badge.has-key{background:rgba(242,98,7,.15);color:var(--accent);border:1px solid rgba(242,98,7,.3);}
.badge.active-badge{background:var(--accent);color:#fff;}

/* Active banner */
.active-banner{
  margin:0 14px 14px;
  background:rgba(242,98,7,.08);border:1px solid rgba(242,98,7,.3);
  border-radius:12px;padding:12px;display:none;
  animation:slideDown .3s ease-out;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.active-banner-title{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.active-banner-row{display:flex;align-items:center;gap:10px;}
.active-banner-icon{font-size:22px;}
.active-banner-name{font-size:14px;font-weight:700;color:var(--txt);}
.active-banner-model{font-size:11px;color:var(--accent);font-family:monospace;margin-top:1px;}

/* Detail sheet */
.sheet-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.75);z-index:100;align-items:flex-end;
}
.sheet-bg.open{display:flex;}
.sheet{
  background:var(--card);border-radius:24px 24px 0 0;
  width:100%;max-height:88vh;overflow-y:auto;
  animation:slideUp .25s cubic-bezier(.34,1.2,.64,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:3px;background:var(--border);border-radius:3px;margin:12px auto 8px;}
.sheet-header{padding:4px 16px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);}
.sheet-logo-area{
  width:48px;height:48px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
}
.sheet-info .sheet-title{font-size:18px;font-weight:700;}
.sheet-info .sheet-subtitle{font-size:12px;color:var(--txt2);margin-top:2px;}
.sheet-body{padding:16px;}
.models-title{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.model-card{
  background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:10px;cursor:pointer;transition:border-color .15s,background .15s;
}
.model-card:active{background:#252E42;}
.model-card.selected{border-color:var(--accent);background:rgba(242,98,7,.05);}
.model-name{font-size:11px;font-weight:600;color:var(--txt);font-family:monospace;}
.model-tag{font-size:9px;color:var(--txt2);margin-top:2px;}
.mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.mode-btn{
  background:var(--card2);border:1px solid var(--border);
  border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;
  transition:.15s;
}
.mode-btn:active{opacity:.7;}
.mode-btn.selected{border-color:var(--accent);background:rgba(242,98,7,.05);}
.mode-icon{font-size:20px;margin-bottom:4px;}
.mode-name{font-size:12px;font-weight:700;color:var(--txt);}
.mode-desc{font-size:10px;color:var(--txt2);margin-top:2px;}
.api-section{margin-bottom:16px;}
.api-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.api-label span{font-size:12px;font-weight:600;color:var(--txt2);}
.api-link{font-size:11px;color:var(--accent);text-decoration:none;}
.api-section input{
  width:100%;background:var(--input);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;color:var(--txt);font-size:13px;
  outline:none;font-family:monospace;
}
.api-section input:focus{border-color:var(--accent);}
.sheet-actions{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  padding:0 16px 28px;
}
.btn-sheet{
  border:none;border-radius:12px;padding:12px 8px;
  font-size:13px;font-weight:700;cursor:pointer;transition:.15s;
}
.btn-sheet.primary{background:var(--accent);color:#fff;}
.btn-sheet.secondary{background:var(--card2);color:var(--txt2);border:1px solid var(--border);}
.btn-sheet.use-chat{background:rgba(14,165,233,.15);color:var(--blue);border:1px solid rgba(14,165,233,.3);}
.btn-sheet:active{opacity:.8;transform:scale(.97);}

/* Empty state */
.empty-state{text-align:center;padding:40px 24px;color:var(--txt2);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-text{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:6px;}
.empty-sub{font-size:12px;line-height:1.5;}
</style>
</head>
<body>

<!-- Search + Filter bar -->
<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Model veya sağlayıcı ara..." oninput="filterProviders()">
  </div>
  <div class="filter-bar">
    <div class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">Tümü</div>
    <div class="filter-chip" data-filter="active" onclick="setFilter('active',this)">Aktif</div>
    <div class="filter-chip" data-filter="free" onclick="setFilter('free',this)">Ücretsiz</div>
    <div class="filter-chip" data-filter="paid" onclick="setFilter('paid',this)">API Anahtarlı</div>
  </div>
</div>

<!-- Active provider banner -->
<div class="active-banner" id="activeBanner">
  <div class="active-banner-title">Aktif Model</div>
  <div class="active-banner-row">
    <div class="active-banner-icon" id="bannerIcon"></div>
    <div>
      <div class="active-banner-name" id="bannerName"></div>
      <div class="active-banner-model" id="bannerModel"></div>
    </div>
  </div>
</div>

<!-- Provider grid -->
<div class="providers-grid" id="providersGrid"></div>

<!-- Detail Sheet -->
<div class="sheet-bg" id="sheetBg" onclick="handleSheetBgClick(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-logo-area" id="s-logo-area"></div>
      <div class="sheet-info">
        <div class="sheet-title" id="s-title"></div>
        <div class="sheet-subtitle" id="s-subtitle"></div>
      </div>
    </div>
    <div class="sheet-body">
      <div class="models-title">Modeller</div>
      <div class="model-grid" id="s-models"></div>
      <div class="models-title">Kullanım Modu</div>
      <div class="mode-row">
        <div class="mode-btn selected" id="mode-normal" onclick="selectMode('normal')">
          <div class="mode-icon">⚡</div>
          <div class="mode-name">Normal</div>
          <div class="mode-desc">Dengeli</div>
        </div>
        <div class="mode-btn" id="mode-power" onclick="selectMode('power')">
          <div class="mode-icon">🚀</div>
          <div class="mode-name">Güçlü</div>
          <div class="mode-desc">Max kalite</div>
        </div>
        <div class="mode-btn" id="mode-economy" onclick="selectMode('economy')">
          <div class="mode-icon">🌱</div>
          <div class="mode-name">Ekonomi</div>
          <div class="mode-desc">Az kota</div>
        </div>
      </div>
      <div class="api-section" id="api-section">
        <div class="api-label">
          <span>API Anahtarı</span>
          <a id="s-docs-link" class="api-link" href="#" onclick="return false;">Nasıl alınır? →</a>
        </div>
        <input type="password" id="s-apikey" placeholder="API anahtarını buraya girin...">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-sheet secondary" onclick="closeSheet()">İptal</button>
      <button class="btn-sheet use-chat" onclick="useForChat()">💬 Chat</button>
      <button class="btn-sheet primary" onclick="saveProvider()">Kaydet</button>
    </div>
  </div>
</div>

<script>
var allProviders = [];
var currentFilter = 'all';
var searchQuery = '';
var selectedProvider = null;
var selectedModel = '';
var selectedMode = 'normal';

/* Real styled logos for each provider */
var LOGO_HTML = {
  openai: '<div class="logo-text logo-text-openai" style="font-size:11px;letter-spacing:1px">OpenAI</div>',
  anthropic: '<div class="logo-text logo-text-anthropic" style="font-size:13px">Claude</div>',
  gemini: '<div class="logo-text logo-text-gemini" style="font-size:13px">Gemini</div>',
  groq: '<div class="logo-text logo-text-groq">groq</div>',
  mistral: '<div class="logo-text logo-text-mistral" style="font-size:13px">Mistral</div>',
  cohere: '<div class="logo-text logo-text-cohere" style="font-size:13px">Cohere</div>',
  openrouter: '<div class="logo-text logo-text-openrouter" style="font-size:10px">OpenRouter</div>',
  together: '<div class="logo-text logo-text-together" style="font-size:11px">Together</div>',
  perplexity: '<div class="logo-text logo-text-perplexity" style="font-size:10px">Perplexity</div>',
  deepseek: '<div class="logo-text logo-text-deepseek" style="font-size:11px">DeepSeek</div>',
  custom: '<div class="logo-text logo-text-custom" style="font-size:11px">&lt;custom&gt;</div>'
};

var LOGO_CLASS = {
  openai:'logo-openai', anthropic:'logo-anthropic', gemini:'logo-gemini',
  groq:'logo-groq', mistral:'logo-mistral', cohere:'logo-cohere',
  openrouter:'logo-openrouter', together:'logo-together',
  perplexity:'logo-perplexity', deepseek:'logo-deepseek', custom:'logo-custom'
};

function hexToRgba(hex, a) {
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  renderProviders();
}

function filterProviders() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderProviders();
}

window.loadMarket = function(data) {
  allProviders = data.providers || [];
  renderActiveBanner(data);
  renderProviders();
};

function renderActiveBanner(data) {
  var activeId = data.activeProvider || '';
  var activeModel = data.activeModel || '';
  var p = allProviders.find(function(x){return x.id===activeId;});
  if (!p) return;
  var banner = document.getElementById('activeBanner');
  banner.style.display = 'block';
  document.getElementById('bannerIcon').innerHTML = LOGO_HTML[p.id] || p.name.charAt(0);
  document.getElementById('bannerName').textContent = p.name;
  document.getElementById('bannerModel').textContent = activeModel || (p.models&&p.models[0]) || '';
}

function renderProviders() {
  var grid = document.getElementById('providersGrid');
  var active = (typeof Market!='undefined') ? Market.getActiveProvider() : '';
  var filtered = allProviders.filter(function(p){
    if (currentFilter==='active' && p.id!==active) return false;
    if (currentFilter==='free' && !p.free) return false;
    if (currentFilter==='paid' && p.free) return false;
    if (searchQuery) {
      var s = (p.name+' '+(p.models||[]).join(' ')).toLowerCase();
      if (s.indexOf(searchQuery)<0) return false;
    }
    return true;
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text">Sonuç bulunamadı</div><div class="empty-sub">Farklı bir arama deneyin</div></div>';
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(function(p, i){
    var isActive = p.id===active;
    var logoClass = LOGO_CLASS[p.id] || 'logo-custom';
    var logoHtml = LOGO_HTML[p.id] || '<div class="logo-text">' + p.name.charAt(0) + '</div>';
    var div = document.createElement('div');
    div.className = 'provider-card' + (isActive?' active':'');
    div.style.animationDelay = (i*0.04)+'s';
    div.innerHTML =
      '<div class="provider-logo '+logoClass+'">' + logoHtml + '</div>' +
      '<div class="provider-body">' +
        '<div class="provider-name">' + p.name + '</div>' +
        '<div class="provider-desc">' + p.description + '</div>' +
        '<div class="provider-badges">' +
          (p.free ? '<span class="badge free">Ücretsiz</span>' : '<span class="badge paid">API</span>') +
          (p.hasKey ? '<span class="badge has-key">✓ Anahtarlı</span>' : '') +
          (isActive ? '<span class="badge active-badge">● Aktif</span>' : '') +
        '</div>' +
      '</div>';
    div.onclick = function(){ openSheet(p.id); };
    grid.appendChild(div);
  });
}

function openSheet(id) {
  var p = allProviders.find(function(x){return x.id===id;});
  if (!p) return;
  selectedProvider = p;
  selectedModel = (typeof Market!='undefined') ? Market.getActiveModel() : (p.models&&p.models[0])||'';
  if (!selectedModel || !p.models||p.models.indexOf(selectedModel)<0) selectedModel=p.models&&p.models[0]||'';

  var logoClass = LOGO_CLASS[p.id]||'logo-custom';
  var logoHtml = LOGO_HTML[p.id]||'<div>'+p.name.charAt(0)+'</div>';
  var logoArea = document.getElementById('s-logo-area');
  logoArea.className = 'sheet-logo-area ' + logoClass;
  logoArea.innerHTML = logoHtml;

  document.getElementById('s-title').textContent = p.name;
  document.getElementById('s-subtitle').textContent = p.description;

  var mGrid = document.getElementById('s-models');
  mGrid.innerHTML = '';
  (p.models||[]).forEach(function(m){
    var c = document.createElement('div');
    c.className = 'model-card' + (m===selectedModel?' selected':'');
    c.innerHTML = '<div class="model-name">' + m + '</div>';
    c.onclick = function(){
      selectedModel = m;
      mGrid.querySelectorAll('.model-card').forEach(function(x){x.classList.remove('selected');});
      c.classList.add('selected');
    };
    mGrid.appendChild(c);
  });

  var apiSec = document.getElementById('api-section');
  if (p.free) { apiSec.style.display='none'; }
  else {
    apiSec.style.display='block';
    document.getElementById('s-apikey').value = '';
    document.getElementById('s-apikey').placeholder = p.id==='custom' ? 'sk-… veya boş' : 'API anahtarını girin';
    var dl = document.getElementById('s-docs-link');
    dl.href = p.docsUrl||'#';
    dl.onclick = function(){
      if(typeof Android!='undefined') Android.openUrl(p.docsUrl||'');
      return false;
    };
  }

  document.getElementById('sheetBg').classList.add('open');
}

function closeSheet() { document.getElementById('sheetBg').classList.remove('open'); }

function handleSheetBgClick(e) {
  if (e.target === document.getElementById('sheetBg')) closeSheet();
}

function selectMode(m) {
  selectedMode = m;
  ['normal','power','economy'].forEach(function(id){
    document.getElementById('mode-'+id).classList.toggle('selected', id===m);
  });
}

function saveProvider() {
  if (!selectedProvider) return;
  var key = document.getElementById('s-apikey').value.trim();
  if (typeof Market!='undefined') {
    Market.saveProvider(selectedProvider.id, selectedModel, selectedMode, key);
  }
  closeSheet();
}

function useForChat() {
  if (!selectedProvider) return;
  var key = document.getElementById('s-apikey').value.trim();
  if (typeof Market!='undefined') {
    Market.openChat(selectedProvider.id, selectedModel);
  }
  closeSheet();
}
</script>
</body>
</html>
