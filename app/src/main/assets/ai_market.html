<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI Marketi — Code-ioPRO</title>
<style>
:root{
  --bg:#0E1525;--card:#131D2E;--card2:#1A2540;
  --accent:#00D4FF;--green:#00FF88;--red:#FF4B4B;--yellow:#FFD740;--purple:#7C4DFF;
  --txt:#fff;--txt2:#8892A4;--border:#1E2A40;--input:#0b1120;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}
/* Filter bar */
.filter-bar{
  display:flex;overflow-x:auto;gap:8px;
  padding:12px 16px;background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{
  background:var(--card2);border:1px solid var(--border);
  color:var(--txt2);border-radius:20px;padding:6px 14px;
  font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.filter-chip.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.filter-chip:active{opacity:.7;}
/* Provider grid */
.providers-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;padding:16px;
}
.provider-card{
  background:var(--card);border:2px solid var(--border);
  border-radius:14px;overflow:hidden;cursor:pointer;
  transition:border-color .2s,transform .15s;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.provider-card.active{border-color:var(--accent);}
.provider-card:active{transform:scale(.96);}
.provider-logo{
  height:56px;display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.provider-body{padding:8px 10px 12px;}
.provider-name{font-size:12px;font-weight:700;color:var(--txt);text-align:center;}
.provider-desc{font-size:10px;color:var(--txt2);text-align:center;margin-top:2px;line-height:1.3;}
.provider-badges{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap;}
.badge{
  border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;
}
.badge.free{background:rgba(0,255,136,.15);color:var(--green);border:1px solid rgba(0,255,136,.3);}
.badge.paid{background:rgba(255,215,64,.1);color:var(--yellow);border:1px solid rgba(255,215,64,.25);}
.badge.has-key{background:rgba(0,212,255,.15);color:var(--accent);border:1px solid rgba(0,212,255,.3);}
.badge.active-badge{background:var(--accent);color:#000;}
/* Detail sheet */
.sheet-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);z-index:100;align-items:flex-end;
}
.sheet-bg.open{display:flex;}
.sheet{
  background:var(--card);border-radius:20px 20px 0 0;
  width:100%;max-height:90vh;overflow-y:auto;
  animation:slideUp .25s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:#243048;border-radius:4px;margin:12px auto 8px;}
.sheet-header{padding:0 16px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.sheet-logo{font-size:36px;}
.sheet-title{font-size:18px;font-weight:700;}
.sheet-subtitle{font-size:12px;color:var(--txt2);margin-top:2px;}
.sheet-body{padding:16px;}
.models-title{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.model-card{
  background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:10px 10px;cursor:pointer;transition:border-color .15s;
}
.model-card:active{background:#243048;}
.model-card.selected{border-color:var(--accent);}
.model-name{font-size:11px;font-weight:600;color:var(--txt);font-family:monospace;}
.mode-row{display:flex;gap:8px;margin-bottom:16px;}
.mode-btn{
  flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);
  text-align:center;cursor:pointer;transition:border-color .15s;
}
.mode-btn.selected{border-color:var(--accent);}
.mode-btn:active{opacity:.7;}
.mode-icon{font-size:20px;}
.mode-name{font-size:12px;font-weight:700;color:var(--txt);}
.mode-desc{font-size:10px;color:var(--txt2);}
.api-section{margin-bottom:16px;}
.api-label{font-size:12px;color:var(--txt2);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.api-link{color:var(--accent);text-decoration:none;font-size:11px;}
input[type=password],input[type=text]{
  width:100%;background:var(--input);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;color:var(--txt);font-size:13px;
  outline:none;-webkit-appearance:none;font-family:monospace;
}
input:focus{border-color:var(--accent);}
.sheet-actions{display:flex;gap:10px;padding:0 16px 24px;}
.btn-sheet{
  flex:1;padding:13px;border-radius:12px;border:none;
  font-size:14px;font-weight:700;cursor:pointer;
}
.btn-sheet.primary{background:var(--accent);color:#000;}
.btn-sheet.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--border);}
.btn-sheet.use-chat{background:var(--purple);color:#fff;}
.btn-sheet:active{opacity:.8;}
.empty{text-align:center;padding:40px;color:var(--txt2);font-size:13px;}
/* Active provider banner */
.active-banner{
  margin:0 16px 8px;background:rgba(0,212,255,.08);
  border:1px solid rgba(0,212,255,.2);border-radius:10px;
  padding:10px 14px;display:flex;align-items:center;gap:10px;
}
.active-banner-icon{font-size:20px;}
.active-banner-info{flex:1;}
.active-banner-name{font-size:12px;font-weight:700;color:var(--accent);}
.active-banner-model{font-size:11px;color:var(--txt2);}
</style>
</head>
<body>

<div class="filter-bar">
  <button class="filter-chip active" onclick="filter('all',this)">🌐 Tümü</button>
  <button class="filter-chip" onclick="filter('free',this)">✨ Ücretsiz</button>
  <button class="filter-chip" onclick="filter('paid',this)">💳 Ücretli</button>
  <button class="filter-chip" onclick="filter('active',this)">✅ API Anahtarlı</button>
  <button class="filter-chip" onclick="filter('coding',this)">💻 Kod</button>
  <button class="filter-chip" onclick="filter('search',this)">🔍 Web Aramalı</button>
</div>

<div id="active-banner-container"></div>

<div class="providers-grid" id="grid"></div>

<!-- Provider detail sheet -->
<div class="sheet-bg" id="sheet-bg" onclick="closeSheet(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-logo" id="s-logo"></div>
      <div><div class="sheet-title" id="s-name"></div><div class="sheet-subtitle" id="s-desc"></div></div>
    </div>
    <div class="sheet-body">
      <div class="models-title">Modeller</div>
      <div class="model-grid" id="s-models"></div>
      <div class="models-title">Mod Seçimi</div>
      <div class="mode-row">
        <div class="mode-btn selected" id="mode-normal" onclick="selectMode('normal')">
          <div class="mode-icon">⚡</div>
          <div class="mode-name">Normal</div>
          <div class="mode-desc">Dengeli kullanım</div>
        </div>
        <div class="mode-btn" id="mode-power" onclick="selectMode('power')">
          <div class="mode-icon">🚀</div>
          <div class="mode-name">Power</div>
          <div class="mode-desc">Max kalite</div>
        </div>
        <div class="mode-btn" id="mode-economy" onclick="selectMode('economy')">
          <div class="mode-icon">🌱</div>
          <div class="mode-name">Ekonomi</div>
          <div class="mode-desc">Az kota</div>
        </div>
      </div>
      <div class="api-section" id="api-section">
        <div class="api-label">
          <span>API Anahtarı</span>
          <a id="s-docs-link" class="api-link" href="#" onclick="return false;">Nasıl alınır? →</a>
        </div>
        <input type="password" id="s-apikey" placeholder="sk-…">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-sheet secondary" onclick="closeSheet()">İptal</button>
      <button class="btn-sheet use-chat" onclick="useForChat()">💬 Chat</button>
      <button class="btn-sheet primary" onclick="saveProvider()">💾 Kaydet</button>
    </div>
  </div>
</div>

<script>
var allProviders = [];
var currentFilter = 'all';
var selectedProvider = null;
var selectedModel = '';
var selectedMode = 'normal';

var LOGOS = {
  openai:'🤖', anthropic:'🧠', gemini:'✨', groq:'⚡',
  mistral:'🌊', cohere:'🔮', openrouter:'🌐', together:'🤝',
  perplexity:'🔍', deepseek:'🌊', custom:'⚙️'
};

window.loadMarket = function(data){
  allProviders = (data.providers || []);
  renderBanner(data.activeProvider, data.activeModel);
  renderGrid(allProviders);
};

function renderBanner(provider, model){
  var el = document.getElementById('active-banner-container');
  if(!provider) { el.innerHTML = ''; return; }
  var p = allProviders.find(function(x){return x.id===provider;});
  el.innerHTML =
    '<div class="active-banner">' +
    '<div class="active-banner-icon">' + (LOGOS[provider]||'🤖') + '</div>' +
    '<div class="active-banner-info">' +
    '<div class="active-banner-name">Aktif: ' + (p?p.name:provider) + '</div>' +
    '<div class="active-banner-model">' + (model||'Varsayılan model') + '</div>' +
    '</div></div>';
}

function renderGrid(providers){
  var el = document.getElementById('grid');
  el.innerHTML = '';
  if(!providers.length){
    el.innerHTML = '<div class="empty" style="grid-column:1/-1">Sağlayıcı bulunamadı</div>';
    return;
  }
  providers.forEach(function(p, i){
    var card = document.createElement('div');
    card.className = 'provider-card' + (p.hasKey?' active':'');
    card.style.animationDelay = (i * 0.04) + 's';
    card.onclick = function(){ openSheet(p); };
    var badges = '';
    if(p.free) badges += '<span class="badge free">Ücretsiz</span>';
    else        badges += '<span class="badge paid">Ücretli</span>';
    if(p.hasKey) badges += '<span class="badge has-key">✓ API</span>';
    card.innerHTML =
      '<div class="provider-logo" style="background:' + hexToRgba(p.color||'#00D4FF',.08) + '">' + (LOGOS[p.id]||'🤖') + '</div>' +
      '<div class="provider-body">' +
      '<div class="provider-name">' + p.name + '</div>' +
      '<div class="provider-desc">' + p.description + '</div>' +
      '<div class="provider-badges">' + badges + '</div>' +
      '</div>';
    el.appendChild(card);
  });
}

function filter(type, btn){
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active');});
  btn.classList.add('active');
  currentFilter = type;
  var filtered;
  if(type==='all')     filtered = allProviders;
  else if(type==='free')   filtered = allProviders.filter(function(p){return p.free;});
  else if(type==='paid')   filtered = allProviders.filter(function(p){return !p.free;});
  else if(type==='active') filtered = allProviders.filter(function(p){return p.hasKey;});
  else if(type==='coding') filtered = allProviders.filter(function(p){return ['openai','anthropic','deepseek','groq','mistral'].includes(p.id);});
  else if(type==='search') filtered = allProviders.filter(function(p){return ['perplexity','openrouter'].includes(p.id);});
  else filtered = allProviders;
  renderGrid(filtered);
}

function openSheet(p){
  selectedProvider = p;
  selectedModel = p.models && p.models.length ? p.models[0] : '';
  selectedMode = 'normal';
  document.getElementById('s-logo').textContent = LOGOS[p.id]||'🤖';
  document.getElementById('s-name').textContent = p.name;
  document.getElementById('s-desc').textContent = p.description;
  document.getElementById('s-apikey').value = '';
  var docsEl = document.getElementById('s-docs-link');
  if(p.docsUrl){ docsEl.style.display=''; docsEl.onclick = function(){return false;}; }
  else { docsEl.style.display='none'; }
  // Models
  var mg = document.getElementById('s-models');
  mg.innerHTML = '';
  (p.models||[]).forEach(function(m,i){
    var mc = document.createElement('div');
    mc.className='model-card'+(i===0?' selected':'');
    mc.id='mc-'+i;
    mc.onclick=function(){
      document.querySelectorAll('.model-card').forEach(function(x){x.classList.remove('selected');});
      mc.classList.add('selected');
      selectedModel = m;
    };
    mc.innerHTML='<div class="model-name">'+m+'</div>';
    mg.appendChild(mc);
  });
  // Mode
  selectMode('normal');
  document.getElementById('sheet-bg').classList.add('open');
}

function closeSheet(e){
  if(!e || e.target===document.getElementById('sheet-bg'))
    document.getElementById('sheet-bg').classList.remove('open');
}

function selectMode(m){
  selectedMode = m;
  ['normal','power','economy'].forEach(function(x){
    document.getElementById('mode-'+x).classList.toggle('selected', x===m);
  });
}

function saveProvider(){
  if(!selectedProvider) return;
  var key = document.getElementById('s-apikey').value.trim();
  if(typeof Market !== 'undefined'){
    if(key) Market.saveApiKey(selectedProvider.id, key, selectedModel);
    else    Market.setActiveModel(selectedProvider.id, selectedModel, selectedMode);
  }
  document.getElementById('sheet-bg').classList.remove('open');
}

function useForChat(){
  if(!selectedProvider) return;
  var key = document.getElementById('s-apikey').value.trim();
  if(key && typeof Market !== 'undefined') Market.saveApiKey(selectedProvider.id, key, selectedModel);
  if(typeof Market !== 'undefined') Market.openChat(selectedProvider.id, selectedModel);
  document.getElementById('sheet-bg').classList.remove('open');
}

function hexToRgba(hex, alpha){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
</script>
</body>
</html>
