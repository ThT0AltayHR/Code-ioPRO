<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Market — CODEX PRO</title>
<style>
:root{
  --bg:#07090F;--card:#0F1627;--card2:#131E30;
  --accent:#1E64FF;--green:#22C55E;--red:#EF4444;--yellow:#F59E0B;--purple:#8A63D2;--cyan:#00BEFF;--orange:#F97316;
  --txt:#D8E4FF;--txt2:#566C8E;--border:#1A2640;--input:#0A1020;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}

/* Search */
.search-wrap{
  padding:10px 14px;background:var(--bg);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
  display:flex;flex-direction:column;gap:8px;
}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--input);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;
}
.search-box input{
  flex:1;background:none;border:none;color:var(--txt);font-size:13px;outline:none;
}
.search-icon{opacity:.45;font-size:14px;}

/* Filter chips */
.filter-bar{display:flex;overflow-x:auto;gap:7px;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{
  background:var(--card2);border:1px solid var(--border);
  color:var(--txt2);border-radius:20px;padding:5px 12px;
  font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0;transition:.15s;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.chip:active{opacity:.7;}

/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;}
.card{
  background:var(--card);border:2px solid var(--border);
  border-radius:14px;overflow:hidden;cursor:pointer;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  animation:popIn .32s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.card.active-card{border-color:var(--accent);box-shadow:0 0 14px rgba(30,100,255,.18);}
.card:active{transform:scale(.96);}

/* Logo area */
.logo-area{
  height:60px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
/* Provider backgrounds */
.logo-openai    {background:linear-gradient(135deg,#000 0%,#111 100%);}
.logo-anthropic {background:linear-gradient(135deg,#1C0A00 0%,#2E1000 100%);}
.logo-gemini    {background:linear-gradient(135deg,#06082A 0%,#0D1248 100%);}
.logo-groq      {background:linear-gradient(135deg,#080014 0%,#140028 100%);}
.logo-mistral   {background:linear-gradient(135deg,#100800 0%,#1E1000 100%);}
.logo-cohere    {background:linear-gradient(135deg,#060E0A 0%,#0A1812 100%);}
.logo-openrouter{background:linear-gradient(135deg,#060A10 0%,#0A1020 100%);}
.logo-together  {background:linear-gradient(135deg,#0A0800 0%,#181000 100%);}
.logo-perplexity{background:linear-gradient(135deg,#000A0C 0%,#001418 100%);}
.logo-deepseek  {background:linear-gradient(135deg,#00040E 0%,#000C20 100%);}
.logo-custom    {background:linear-gradient(135deg,#080A10 0%,#101428 100%);}

/* Logo text / SVG */
.logo-text{
  font-weight:900;letter-spacing:-0.5px;text-align:center;
  user-select:none;line-height:1;
}
/* Colors matching real brands */
.lt-openai{color:#fff;font-size:13px;font-family:sans-serif;}
.lt-anthropic{color:#CC785C;font-size:14px;font-family:Georgia,serif;letter-spacing:0.5px;}
.lt-gemini{font-size:14px;font-family:sans-serif;background:linear-gradient(90deg,#4285F4,#EA4335,#FBBC05,#34A853);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.lt-groq{color:#F55036;font-size:18px;font-family:monospace;font-weight:900;}
.lt-mistral{color:#FA520F;font-size:14px;font-family:sans-serif;}
.lt-cohere{color:#39D353;font-size:13px;font-family:sans-serif;}
.lt-openrouter{color:#6366F1;font-size:12px;font-family:monospace;}
.lt-together{color:#F5B731;font-size:13px;font-family:sans-serif;}
.lt-perplexity{color:#20B2AA;font-size:13px;font-family:sans-serif;}
.lt-deepseek{color:#4DA6FF;font-size:13px;font-family:sans-serif;}
.lt-custom{color:var(--txt2);font-size:12px;font-family:monospace;}

/* Provider body */
.prov-body{padding:8px 10px 12px;}
.prov-name{font-size:12px;font-weight:700;color:var(--txt);text-align:center;}
.prov-desc{font-size:10px;color:var(--txt2);text-align:center;margin-top:2px;line-height:1.3;}
.prov-badges{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap;}
.badge{border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;}
.badge.free{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.badge.paid{background:rgba(245,158,11,.08);color:var(--yellow);border:1px solid rgba(245,158,11,.2);}
.badge.has-key{background:rgba(30,100,255,.12);color:var(--accent);border:1px solid rgba(30,100,255,.25);}
.badge.active-badge{background:var(--accent);color:#fff;border-color:var(--accent);}

/* Active banner */
.active-banner{
  margin:10px 14px 0;
  background:rgba(30,100,255,.07);border:1px solid rgba(30,100,255,.25);
  border-radius:12px;padding:10px 12px;display:none;
  animation:slideDown .25s ease-out;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.active-banner-label{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.active-banner-name{font-size:14px;font-weight:700;color:var(--txt);}
.active-banner-model{font-size:11px;color:var(--accent);font-family:monospace;margin-top:2px;}

/* Detail sheet */
.sheet-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.75);z-index:100;align-items:flex-end;
}
.sheet-bg.open{display:flex;}
.sheet{
  background:var(--card);border-radius:22px 22px 0 0;
  width:100%;max-height:90vh;overflow-y:auto;
  animation:slideUp .22s ease-out;
  border-top:1px solid var(--border);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:10px auto 6px;}
.sheet-header{padding:0 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.sheet-logo-box{width:48px;height:48px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-title{font-size:18px;font-weight:700;}
.sheet-subtitle{font-size:12px;color:var(--txt2);margin-top:2px;}
.sheet-body{padding:14px 16px;}

.s-section-title{font-size:10px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
.model-chip{
  background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:9px 10px;cursor:pointer;transition:border-color .15s;
}
.model-chip:active{background:#131E30;}
.model-chip.selected{border-color:var(--accent);}
.model-chip-name{font-size:11px;font-weight:600;color:var(--txt);font-family:monospace;}

.mode-row{display:flex;gap:7px;margin-bottom:14px;}
.mode-btn{
  flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--border);
  text-align:center;cursor:pointer;transition:border-color .15s;background:var(--card2);
}
.mode-btn.selected{border-color:var(--accent);}
.mode-btn:active{opacity:.7;}
.mode-icon{font-size:18px;}
.mode-name{font-size:11px;font-weight:700;color:var(--txt);margin-top:3px;}
.mode-desc{font-size:9px;color:var(--txt2);}

.api-label{font-size:12px;color:var(--txt2);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.api-link{color:var(--accent);text-decoration:none;font-size:11px;}
input[type=password],input[type=text]{
  width:100%;background:var(--input);border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13px;
  outline:none;-webkit-appearance:none;font-family:monospace;
}
input:focus{border-color:var(--accent);}

.sheet-actions{display:flex;gap:9px;padding:0 16px 28px;margin-top:6px;}
.sbtn{
  flex:1;padding:13px;border-radius:12px;border:none;
  font-size:13px;font-weight:700;cursor:pointer;
}
.sbtn.primary{background:var(--accent);color:#fff;}
.sbtn.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--border);}
.sbtn.chat-btn{background:var(--purple);color:#fff;}
.sbtn:active{opacity:.8;}

.empty{text-align:center;padding:40px;color:var(--txt2);font-size:13px;}
</style>
</head>
<body>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Sağlayıcı ara…" oninput="handleSearch(this.value)">
  </div>
  <div class="filter-bar">
    <button class="chip active"  onclick="filter('all',this)">Tümü</button>
    <button class="chip" onclick="filter('free',this)">Ücretsiz</button>
    <button class="chip" onclick="filter('paid',this)">Ücretli</button>
    <button class="chip" onclick="filter('active',this)">API Anahtarlı</button>
    <button class="chip" onclick="filter('coding',this)">Kod</button>
    <button class="chip" onclick="filter('search',this)">Web Aramalı</button>
  </div>
</div>

<div id="active-banner" class="active-banner">
  <div class="active-banner-label">Aktif Sağlayıcı</div>
  <div id="active-banner-name" class="active-banner-name"></div>
  <div id="active-banner-model" class="active-banner-model"></div>
</div>

<div class="grid" id="grid"></div>

<!-- Detail sheet -->
<div class="sheet-bg" id="sheet-bg" onclick="closeSheet(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-logo-box" id="s-logo-box"></div>
      <div>
        <div class="sheet-title" id="s-name"></div>
        <div class="sheet-subtitle" id="s-desc"></div>
      </div>
    </div>
    <div class="sheet-body">
      <div class="s-section-title">Modeller</div>
      <div class="model-grid" id="s-models"></div>
      <div class="s-section-title">Mod Seçimi</div>
      <div class="mode-row">
        <div class="mode-btn selected" id="mode-normal" onclick="selectMode('normal')">
          <div class="mode-icon">⚡</div>
          <div class="mode-name">Normal</div>
          <div class="mode-desc">Dengeli</div>
        </div>
        <div class="mode-btn" id="mode-power" onclick="selectMode('power')">
          <div class="mode-icon">🚀</div>
          <div class="mode-name">Power</div>
          <div class="mode-desc">Max kalite</div>
        </div>
        <div class="mode-btn" id="mode-economy" onclick="selectMode('economy')">
          <div class="mode-icon">🌱</div>
          <div class="mode-name">Ekonomi</div>
          <div class="mode-desc">Az kota</div>
        </div>
      </div>
      <div id="api-section" class="api-section" style="margin-bottom:14px">
        <div class="api-label">
          <span>API Anahtarı</span>
          <a id="s-docs-link" class="api-link" href="#" onclick="return false;" style="display:none">Nasıl alınır? →</a>
        </div>
        <input type="password" id="s-apikey" placeholder="sk-…">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="sbtn secondary" onclick="closeSheet()">İptal</button>
      <button class="sbtn chat-btn" onclick="useForChat()">💬 Chat</button>
      <button class="sbtn primary" onclick="saveProvider()">💾 Kaydet</button>
    </div>
  </div>
</div>

<script>
var allProviders = [], currentFilter = 'all', searchQuery = '';
var selectedProvider = null, selectedModel = '', selectedMode = 'normal';

/* Real brand logo text/color data */
var BRAND = {
  openai:     { cls:'lt-openai',     bg:'logo-openai',     text:'OpenAI' },
  anthropic:  { cls:'lt-anthropic',  bg:'logo-anthropic',  text:'Anthropic' },
  gemini:     { cls:'lt-gemini',     bg:'logo-gemini',     text:'Gemini' },
  groq:       { cls:'lt-groq',       bg:'logo-groq',       text:'Groq' },
  mistral:    { cls:'lt-mistral',    bg:'logo-mistral',    text:'Mistral' },
  cohere:     { cls:'lt-cohere',     bg:'logo-cohere',     text:'Cohere' },
  openrouter: { cls:'lt-openrouter', bg:'logo-openrouter', text:'OpenRouter' },
  together:   { cls:'lt-together',   bg:'logo-together',   text:'Together' },
  perplexity: { cls:'lt-perplexity', bg:'logo-perplexity', text:'Perplexity' },
  deepseek:   { cls:'lt-deepseek',   bg:'logo-deepseek',   text:'DeepSeek' },
  custom:     { cls:'lt-custom',     bg:'logo-custom',     text:'Custom API' },
};

window.loadMarket = function(data){
  allProviders = data.providers || [];
  renderBanner(data.activeProvider, data.activeModel);
  renderGrid(allProviders);
};

function renderBanner(provider, model){
  var el = document.getElementById('active-banner');
  if(!provider){ el.style.display='none'; return; }
  var p = allProviders.find(function(x){return x.id===provider;});
  document.getElementById('active-banner-name').textContent = 'Aktif: ' + (p?p.name:provider);
  document.getElementById('active-banner-model').textContent = model || 'Varsayılan model';
  el.style.display = 'block';
}

function buildLogoHTML(id){
  var b = BRAND[id] || BRAND['custom'];
  return '<div class="logo-area ' + b.bg + '"><div class="logo-text ' + b.cls + '">' + b.text + '</div></div>';
}

function buildSheetLogo(id){
  var b = BRAND[id] || BRAND['custom'];
  return '<div class="' + b.bg + '" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"><div class="logo-text ' + b.cls + '">' + b.text + '</div></div>';
}

function renderGrid(providers){
  var el = document.getElementById('grid');
  el.innerHTML = '';
  if(!providers.length){
    el.innerHTML = '<div class="empty" style="grid-column:1/-1">Sağlayıcı bulunamadı</div>';
    return;
  }
  providers.forEach(function(p, i){
    var card = document.createElement('div');
    card.className = 'card' + (p.hasKey ? ' active-card' : '');
    card.style.animationDelay = (i * 0.035) + 's';
    card.onclick = function(){ openSheet(p); };
    var badges = '';
    if(p.free) badges += '<span class="badge free">Ücretsiz</span>';
    else        badges += '<span class="badge paid">Ücretli</span>';
    if(p.hasKey) badges += '<span class="badge has-key">✓ API</span>';
    card.innerHTML =
      buildLogoHTML(p.id) +
      '<div class="prov-body">' +
      '<div class="prov-name">' + p.name + '</div>' +
      '<div class="prov-desc">' + p.description + '</div>' +
      '<div class="prov-badges">' + badges + '</div>' +
      '</div>';
    el.appendChild(card);
  });
}

function handleSearch(q){
  searchQuery = q.toLowerCase().trim();
  applyFilters();
}

function filter(type, btn){
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  btn.classList.add('active');
  currentFilter = type;
  applyFilters();
}

function applyFilters(){
  var filtered = allProviders;
  if(currentFilter==='free')   filtered = filtered.filter(function(p){return p.free;});
  if(currentFilter==='paid')   filtered = filtered.filter(function(p){return !p.free;});
  if(currentFilter==='active') filtered = filtered.filter(function(p){return p.hasKey;});
  if(currentFilter==='coding') filtered = filtered.filter(function(p){return ['openai','anthropic','deepseek','groq','mistral'].indexOf(p.id)!==-1;});
  if(currentFilter==='search') filtered = filtered.filter(function(p){return ['perplexity','openrouter'].indexOf(p.id)!==-1;});
  if(searchQuery)              filtered = filtered.filter(function(p){return p.name.toLowerCase().indexOf(searchQuery)!==-1;});
  renderGrid(filtered);
}

function openSheet(p){
  selectedProvider = p; selectedModel = p.models&&p.models.length?p.models[0]:''; selectedMode='normal';
  document.getElementById('s-logo-box').innerHTML = buildSheetLogo(p.id);
  document.getElementById('s-name').textContent = p.name;
  document.getElementById('s-desc').textContent = p.description;
  document.getElementById('s-apikey').value = '';
  var dl = document.getElementById('s-docs-link');
  if(p.docsUrl){ dl.style.display=''; dl.href='#'; } else { dl.style.display='none'; }
  var mg = document.getElementById('s-models'); mg.innerHTML='';
  (p.models||[]).forEach(function(m,i){
    var mc=document.createElement('div');
    mc.className='model-chip'+(i===0?' selected':'');
    mc.id='mc-'+i;
    mc.onclick=function(){document.querySelectorAll('.model-chip').forEach(function(x){x.classList.remove('selected');});mc.classList.add('selected');selectedModel=m;};
    mc.innerHTML='<div class="model-chip-name">'+m+'</div>';
    mg.appendChild(mc);
  });
  selectMode('normal');
  document.getElementById('sheet-bg').classList.add('open');
}

function closeSheet(e){
  if(!e||e.target===document.getElementById('sheet-bg'))
    document.getElementById('sheet-bg').classList.remove('open');
}

function selectMode(m){
  selectedMode=m;
  ['normal','power','economy'].forEach(function(x){
    document.getElementById('mode-'+x).classList.toggle('selected',x===m);
  });
}

function saveProvider(){
  if(!selectedProvider)return;
  var key=document.getElementById('s-apikey').value.trim();
  if(typeof Market!=='undefined'){
    if(key) Market.saveApiKey(selectedProvider.id,key,selectedModel);
    else    Market.setActiveModel(selectedProvider.id,selectedModel,selectedMode);
  }
  document.getElementById('sheet-bg').classList.remove('open');
}

function useForChat(){
  if(!selectedProvider)return;
  var key=document.getElementById('s-apikey').value.trim();
  if(key&&typeof Market!=='undefined') Market.saveApiKey(selectedProvider.id,key,selectedModel);
  if(typeof Market!=='undefined') Market.openChat(selectedProvider.id,selectedModel);
  document.getElementById('sheet-bg').classList.remove('open');
}
</script>
</body>
</html>
