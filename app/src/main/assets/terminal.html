<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Code-ioPRO Shell</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:#000;
  color:#00FF88;
  font-family:'Courier New',Courier,monospace;
  font-size:13px;
  line-height:1.5;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
#output{
  flex:1;
  overflow-y:auto;
  padding:8px 8px 4px 8px;
  word-break:break-all;
  white-space:pre-wrap;
}
#output::-webkit-scrollbar{width:4px;}
#output::-webkit-scrollbar-thumb{background:#1a1a1a;}
.line{display:block;min-height:1.5em;}
.line.err{color:#FF4B4B;}
.line.sys{color:#00D4FF;}
.line.warn{color:#FFD740;}
.prompt-line{display:flex;align-items:flex-start;gap:4px;}
.prompt-text{color:#00D4FF;white-space:nowrap;padding-top:1px;}
.cmd-text{color:#fff;}
#input-area{
  display:flex;
  align-items:center;
  padding:6px 8px;
  background:#0a0a0a;
  border-top:1px solid #1a1a1a;
  gap:6px;
}
#prompt-label{
  color:#00D4FF;
  font-family:monospace;
  font-size:13px;
  white-space:nowrap;
  flex-shrink:0;
}
#cmd-input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-family:'Courier New',Courier,monospace;
  font-size:13px;
  caret-color:#00D4FF;
  -webkit-appearance:none;
  min-width:0;
}
#btn-run{
  background:#00D4FF;
  color:#000;
  border:none;
  border-radius:6px;
  padding:6px 14px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
  font-family:monospace;
}
#btn-stop{
  background:#FF4B4B;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:6px 10px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
  display:none;
  font-family:monospace;
}
/* ANSI colors */
.c30{color:#000}.c31{color:#FF4B4B}.c32{color:#00FF88}.c33{color:#FFD740}
.c34{color:#4A9EFF}.c35{color:#CC44FF}.c36{color:#00D4FF}.c37{color:#fff}
.c90{color:#555}.c91{color:#FF6B6B}.c92{color:#44FF88}.c93{color:#FFE066}
.c94{color:#66AAFF}.c95{color:#FF66CC}.c96{color:#66EEFF}.c97{color:#eee}
.bold{font-weight:700}
#cursor{display:inline-block;width:8px;height:14px;background:#00D4FF;vertical-align:middle;animation:blink 1s step-end infinite;margin-left:1px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
/* Keyboard toolbar */
#kbd-bar{
  display:flex;
  overflow-x:auto;
  gap:4px;
  padding:4px 8px;
  background:#0d0d0d;
  border-top:1px solid #1a1a1a;
}
#kbd-bar::-webkit-scrollbar{display:none;}
.kbd-btn{
  background:#1a1a1a;
  color:#ccc;
  border:1px solid #333;
  border-radius:5px;
  padding:5px 10px;
  font-size:12px;
  white-space:nowrap;
  cursor:pointer;
  flex-shrink:0;
  font-family:monospace;
}
.kbd-btn:active{background:#00D4FF;color:#000;}
</style>
</head>
<body>
<div id="output"><span id="cursor"></span></div>

<div id="kbd-bar">
  <button class="kbd-btn" onclick="insertKbd('Tab')">Tab</button>
  <button class="kbd-btn" onclick="insertKbd('  ')">2×Spc</button>
  <button class="kbd-btn" onclick="sendKbd('up')">↑</button>
  <button class="kbd-btn" onclick="sendKbd('down')">↓</button>
  <button class="kbd-btn" onclick="insertKbd('/')">/ </button>
  <button class="kbd-btn" onclick="insertKbd('-')">-</button>
  <button class="kbd-btn" onclick="insertKbd('|')">|</button>
  <button class="kbd-btn" onclick="insertKbd('&amp;&amp;')">&amp;&amp;</button>
  <button class="kbd-btn" onclick="insertKbd('>')">></button>
  <button class="kbd-btn" onclick="insertKbd('>>')">>></button>
  <button class="kbd-btn" onclick="ctrlC()">Ctrl+C</button>
  <button class="kbd-btn" onclick="clearTerm()">Clear</button>
  <button class="kbd-btn" onclick="insertKbd('\\')">\</button>
  <button class="kbd-btn" onclick="insertKbd('\"')">\"</button>
  <button class="kbd-btn" onclick="insertKbd(\"'\")">'</button>
  <button class="kbd-btn" onclick="insertKbd('~')">~</button>
</div>

<div id="input-area">
  <span id="prompt-label">~ $</span>
  <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="komut girin…">
  <button id="btn-stop" onclick="ctrlC()">■ Dur</button>
  <button id="btn-run" onclick="submit()">▶ Çalıştır</button>
</div>

<script>
var histIdx = -1;
var pendingCmd = '';

var outputEl = document.getElementById('output');
var inputEl  = document.getElementById('cmd-input');
var stopBtn  = document.getElementById('btn-stop');
var runBtn   = document.getElementById('btn-run');
var cursor   = document.getElementById('cursor');

window.termWrite = function(text){
  var span = document.createElement('span');
  span.className = 'line';
  span.innerHTML = ansiToHtml(text);
  outputEl.insertBefore(span, cursor);
  scrollBottom();
};

window.termPrompt = function(path){
  document.getElementById('prompt-label').textContent = path + ' $';
  stopBtn.style.display = 'none';
  runBtn.style.display = '';
  inputEl.focus();
};

window.termClear = function(){
  while(outputEl.firstChild && outputEl.firstChild !== cursor){
    outputEl.removeChild(outputEl.firstChild);
  }
};

function scrollBottom(){ outputEl.scrollTop = outputEl.scrollHeight; }

function submit(){
  var cmd = inputEl.value.trim();
  if(!cmd) return;
  inputEl.value = '';
  histIdx = -1;
  stopBtn.style.display = '';
  runBtn.style.display  = 'none';
  var line = document.createElement('span');
  line.className = 'line prompt-line';
  line.innerHTML = '<span class="prompt-text">' + escHtml(document.getElementById('prompt-label').textContent) + '</span> <span class="cmd-text">' + escHtml(cmd) + '</span>';
  outputEl.insertBefore(line, cursor);
  scrollBottom();
  if(typeof Terminal !== 'undefined') Terminal.onCommand(cmd);
}

function ctrlC(){
  if(typeof Terminal !== 'undefined') Terminal.onCtrlC();
  stopBtn.style.display = 'none';
  runBtn.style.display  = '';
}

function clearTerm(){
  if(typeof Terminal !== 'undefined') Terminal.onCommand('clear');
  else window.termClear();
}

function insertKbd(ch){
  inputEl.value += ch;
  inputEl.focus();
}

function sendKbd(dir){
  if(!window.Terminal) return;
  var size = Terminal.getHistorySize();
  if(dir === 'up'){
    histIdx = Math.min(histIdx + 1, size - 1);
  } else {
    histIdx = Math.max(histIdx - 1, -1);
  }
  inputEl.value = histIdx >= 0 ? Terminal.getHistory(histIdx) : pendingCmd;
}

inputEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); submit(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); sendKbd('up'); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); sendKbd('down'); }
  else { histIdx = -1; }
});

// ANSI escape codes → HTML
function ansiToHtml(text){
  text = escHtml(text);
  // Bold
  text = text.replace(/\033\[1m|\033\[1;(\d+)m/g, function(m, code){
    return '<span class="bold' + (code ? ' c'+code : '') + '">';
  });
  // Colors \033[Xm or \033[X;Ym
  text = text.replace(/\033\[(\d+)(?:;(\d+))?m/g, function(m, a, b){
    var cls = '';
    if(a==='0'||a==='00') return '</span>';
    cls += 'c' + a;
    if(b) cls += ' c' + b;
    return '<span class="' + cls + '">';
  });
  // Remove remaining escapes
  text = text.replace(/\033\[[^m]*m/g,'');
  return text;
}

function escHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Notify Android that terminal is ready
document.addEventListener('DOMContentLoaded', function(){
  if(typeof Terminal !== 'undefined') Terminal.onReady();
  inputEl.focus();
});
</script>
</body>
</html>
