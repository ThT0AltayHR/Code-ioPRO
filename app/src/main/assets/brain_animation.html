<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  var W=window.innerWidth,H=window.innerHeight;
  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true});
  renderer.setSize(W,H);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(60,W/H,0.1,100);
  camera.position.set(0,0,2.8);

  // Brain mesh using sphere + noise displacement
  var geo=new THREE.SphereGeometry(1,64,64);
  var pos=geo.attributes.position;
  var norms=[];
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    var n=noise3(x*2.5,y*2.5,z*2.5)*0.18+noise3(x*5,y*5,z*5)*0.08;
    // Flatten bottom slightly (like real brain)
    var fy=y<0?y*0.7:y;
    pos.setXYZ(i,x*(1+n),fy*(1+n*0.6),z*(1+n));
    norms.push(x,y,z);
  }
  pos.needsUpdate=true;
  geo.computeVertexNormals();

  // Materials
  var brainMat=new THREE.MeshPhongMaterial({
    color:0x1a2a3a,emissive:0x001020,specular:0x003355,shininess:40,
    transparent:true,opacity:0.92,wireframe:false
  });
  var brain=new THREE.Mesh(geo,brainMat);
  scene.add(brain);

  // Wireframe overlay for circuit look
  var wireGeo=new THREE.SphereGeometry(1.005,24,24);
  var wireMat=new THREE.MeshBasicMaterial({color:0x00D4FF,wireframe:true,transparent:true,opacity:0.06});
  var wire=new THREE.Mesh(wireGeo,wireMat);
  brain.add(wire);

  // Circuit nodes (10 blue spheres)
  var nodes=[];
  var nodeGeo=new THREE.SphereGeometry(0.04,8,8);
  for(var i=0;i<10;i++){
    var phi=Math.acos(-1+2*i/10);
    var theta=Math.sqrt(10*Math.PI)*phi;
    var nm=new THREE.MeshBasicMaterial({color:0x00D4FF,transparent:true,opacity:0});
    var node=new THREE.Mesh(nodeGeo,nm);
    node.position.setFromSphericalCoords(1.05,phi,theta);
    scene.add(node);
    nodes.push({mesh:node,phi:phi,theta:theta,phase:Math.random()*Math.PI*2,speed:0.5+Math.random()});
  }

  // Connection lines between nodes
  var lines=[];
  var lineMat=new THREE.LineBasicMaterial({color:0x00D4FF,transparent:true,opacity:0});
  for(var i=0;i<nodes.length-1;i++){
    var pts=[nodes[i].mesh.position.clone(),nodes[(i+2)%nodes.length].mesh.position.clone()];
    var lg=new THREE.BufferGeometry().setFromPoints(pts);
    var line=new THREE.Line(lg,lineMat.clone());
    scene.add(line);
    lines.push(line);
  }

  // Glow sphere
  var glowGeo=new THREE.SphereGeometry(1.15,32,32);
  var glowMat=new THREE.MeshBasicMaterial({color:0x00D4FF,transparent:true,opacity:0,side:THREE.BackSide});
  var glow=new THREE.Mesh(glowGeo,glowMat);
  scene.add(glow);

  // Lights
  scene.add(new THREE.AmbientLight(0x112233,1.5));
  var pl=new THREE.PointLight(0x00D4FF,0.5,5);pl.position.set(2,2,2);scene.add(pl);
  var pl2=new THREE.PointLight(0x0066ff,0.3,5);pl2.position.set(-2,-1,-2);scene.add(pl2);

  // State
  var isActive=false,quota=100,t=0;

  window.setBrainActive=function(active){
    isActive=!!active;
    if(typeof BrainNative!='undefined')BrainNative.onBrainReady();
  };
  window.setBrainQuota=function(q){quota=Math.max(0,Math.min(100,q));};

  // Simple 3D noise
  function noise3(x,y,z){
    var X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
    x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
    var u=fade(x),v=fade(y),w=fade(z);
    var s=Math.sin(X*127.1+Y*311.7+Z*74.7)*43758.5453;
    return (s-Math.floor(s))*2-1;
  }
  function fade(t){return t*t*t*(t*(t*6-15)+10);}

  function animate(){
    requestAnimationFrame(animate);
    t+=0.016;
    brain.rotation.y+=0.005;
    brain.rotation.x=Math.sin(t*0.3)*0.08;

    var q=quota/100;
    var brightness=isActive?0.15+q*0.15:0.03;
    brainMat.emissiveIntensity=brightness;
    brainMat.emissive.setRGB(0,brightness*0.3,brightness*0.5);

    // Nodes & lines
    var na=isActive?0.9*q:0;
    nodes.forEach(function(n,i){
      var pulse=0.5+0.5*Math.sin(t*n.speed*2+n.phase);
      n.mesh.material.opacity=na*pulse;
      // orbit slowly
      n.theta+=0.003;
      n.mesh.position.setFromSphericalCoords(1.05,n.phi,n.theta);
    });
    lines.forEach(function(l,i){
      var pulse=0.3+0.3*Math.sin(t*1.5+i*0.7);
      l.material.opacity=isActive?na*pulse*0.6:0;
    });

    // Glow
    glowMat.opacity=isActive?0.04*q:0;

    // Wire
    wireMat.opacity=isActive?0.08+0.04*Math.sin(t)*q:0.04;

    // Point light pulse
    pl.intensity=isActive?0.5+0.3*Math.sin(t*3)*q:0.2;

    renderer.render(scene,camera);
  }
  animate();

  window.addEventListener('resize',function(){
    W=window.innerWidth;H=window.innerHeight;
    renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();
  });

  if(typeof BrainNative!='undefined')BrainNative.onBrainReady();
})();
</script>
</body>
</html>
