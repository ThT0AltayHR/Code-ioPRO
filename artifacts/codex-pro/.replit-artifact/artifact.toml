kind = "mobile"
previewPath = "/"
title = "CODEX PRO"
description = "CODEX PRO v2.0.0 — Tam özellikli AI kodlama asistanı mobil uygulaması. Tam ekran dark-themed IDE arayüzü, gerçek DuckDuckGo AI sohbet entegrasyonu, sesli sohbet, model değiştirme (GPT-4o, Claude, Gemini, Mistral), mobil uyumlu responsive tasarım."
version = "1.0.0"
id = "artifacts/codex-pro"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26236

[services.development]
run = "pnpm --filter @workspace/codex-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codex-pro", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/codex-pro", "run", "serve" ]

[services.env]
PORT = "26236"
BASE_PATH = "/"
