name: Code-ioPRO — Release APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build türü'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]
      release_tag:
        description: 'Release tag adı (boş bırakılırsa otomatik oluşturulur)'
        required: false
        default: ''

env:
  APP_MODULE: app
  APP_NAME: Code-ioPRO

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📅 Değişkenler
        run: |
          echo "DATE=$(date +'%Y-%m-%d')"      >> $GITHUB_ENV
          echo "BUILD_NUM=${{ github.run_number }}" >> $GITHUB_ENV
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔐 gradlew izni
        run: chmod +x ./gradlew

      - name: 📦 Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 🔑 İmzalama keystore hazırla
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "✅ GitHub Secrets'tan keystore kullanılıyor"
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > /tmp/release.jks
            echo "SIGNING_KEY_STORE_PATH=/tmp/release.jks"                        >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}"   >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}"             >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}"       >> $GITHUB_ENV
          else
            echo "⚠️  SIGNING_KEY bulunamadı — CI test keystore oluşturuluyor"
            keytool -genkey -v \
              -keystore /tmp/release.jks \
              -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass codeio2024 -keypass codeio2024 \
              -dname "CN=Code-ioPRO CI, OU=Dev, O=CodeioPRO, L=TR, S=TR, C=TR" \
              2>/dev/null
            echo "SIGNING_KEY_STORE_PATH=/tmp/release.jks" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=codeio2024"        >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=release"                >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=codeio2024"          >> $GITHUB_ENV
          fi

      - name: 🏗️ Release APK derle
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          SIGNING_KEY_STORE_PATH: ${{ env.SIGNING_KEY_STORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ env.SIGNING_KEY_PASSWORD }}

      - name: 🔧 Debug APK derle
        run: ./gradlew assembleDebug --no-daemon
        if: always()

      - name: 📋 APK bilgisi
        run: |
          echo "=== Derlenen APK'lar ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "APK bulunamadı"

      - name: 📤 Release APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-release-APK
          path: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 📤 Debug APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-debug-APK
          path: ${{ env.APP_MODULE }}/build/outputs/apk/debug/*.apk
          retention-days: 30
        if: always()

      - name: 🚀 GitHub Release oluştur
        if: >
          success() &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Code-ioPRO v1.2.0 — Build #${{ env.BUILD_NUM }}"
          body: |
            ## 🚀 Code-ioPRO v1.2.0 — Build #${{ env.BUILD_NUM }}

            **Tarih:** ${{ env.DATE }}
            **Branch:** ${{ github.ref_name }}

            ### ✅ v1.2.0 Değişiklikleri:
            - 🔒 Tüm DuckDuckGo marka referansları kaldırıldı — uygulama tamamen Muhammed'e ait
            - 🧠 Yapay zeka sistem promptu güncellendi — geliştirici kimliği korunuyor
            - 🎨 Model seçici arayüzü iyileştirildi
            - 📦 Default provider güncellendi (m-ai)
            - 🔢 Version: 1.1.5 → 1.2.0 (versionCode: 15 → 16)
            - 🛡️ Marka koruma JS enjeksiyonu eklendi
            - ⚡ Sub-agent UI gerçek görev takibi ile güçlendirildi
            - 🌟 Beyin animasyonu geliştirildi

            ### 📱 Kurulum:
            APK'yı cihaza indirin, **Bilinmeyen kaynaklara izin ver** ile kurun.
          files: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
