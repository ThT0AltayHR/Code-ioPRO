name: Code-ioPRO — Release APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build türü'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]
      release_tag:
        description: 'Release tag adı (boş bırakılırsa otomatik oluşturulur)'
        required: false
        default: ''

env:
  APP_MODULE: app
  APP_NAME: Code-ioPRO

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📅 Değişkenler
        run: |
          echo "DATE=$(date +'%Y-%m-%d')"            >> $GITHUB_ENV
          echo "BUILD_NUM=${{ github.run_number }}"  >> $GITHUB_ENV
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${{ github.run_number }}"         >> $GITHUB_ENV
          fi

      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔐 gradlew izni
        run: chmod +x ./gradlew

      - name: 🏗️ Release APK derle
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
        env:
          SIGNING_KEY_STORE_PATH: ${{ secrets.SIGNING_KEY_STORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: 🔍 APK kontrol
        run: |
          echo "=== Derlenen APK'lar ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 📤 Release APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-v1.3.0-release-APK
          path: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 📤 Debug APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-v1.3.0-debug-APK
          path: ${{ env.APP_MODULE }}/build/outputs/apk/debug/*.apk
          retention-days: 30
        if: always()

      - name: 🚀 GitHub Release oluştur
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Code-ioPRO v1.3.0 — Build #${{ env.BUILD_NUM }}"
          body: |
            ## 🚀 Code-ioPRO v1.3.0 — Build #${{ env.BUILD_NUM }}

            **Tarih:** ${{ env.DATE }}
            **Branch:** ${{ github.ref_name }}

            ### ✨ v1.3.0 — Yeni Arayüz (Tam Yeniden Tasarım)

            #### 🎨 Görsel & UX
            - 🟠 Replit ilhamlı tam arayüz yeniden tasarımı (turuncu accent)
            - 🗂️ Chat ekranında 4 mod sekmesi: 🎙️ Sesli · 💬 Sohbet · 💻 Kod · 🧠 AI
            - 📱 Tüm butonlar dokunma dostu yeniden boyutlandırıldı (min 44dp)
            - 🧭 Bottom nav 66dp yüksekliğe çıkarıldı, ikonlar 24dp
            - 💨 Kompakt model seçici — sağ altta küçük pill, tam ekranı kaplamaz

            #### 🤖 AI Market
            - ✅ Gerçek sağlayıcı logoları (OpenAI, Claude, Gemini, Groq, Mistral…)
            - ❌ Google/DuckDuckGo logoları tamamen kaldırıldı
            - 🔍 Arama çubuğu eklendi
            - 🎴 Yeni kart tasarımı, düzgün badge'ler

            #### 🔧 Sistem
            - 🤐 Sistem promptu düzeltildi (geliştirici: Muhammed)
            - 🔗 Varsayılan chat URL güncellendi
            - 📦 versionCode: 16 → 17 / versionName: 1.2.0 → 1.3.0

            ### 📱 Kurulum:
            APK dosyasını cihaza indirin, **Bilinmeyen kaynaklara izin ver** ile kurun.
          files: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
