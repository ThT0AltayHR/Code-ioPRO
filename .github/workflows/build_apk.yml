name: CODEX PRO — Release APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build türü'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]
      release_tag:
        description: 'Release tag adı (boş bırakılırsa otomatik)'
        required: false
        default: ''

env:
  APP_MODULE: app
  APP_NAME: CODEX-PRO
  VERSION_NAME: 2.0.0

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📅 Değişkenler
        run: |
          echo "DATE=$(date +'%Y-%m-%d')"              >> $GITHUB_ENV
          echo "BUILD_NUM=${{ github.run_number }}"    >> $GITHUB_ENV
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${{ github.run_number }}"         >> $GITHUB_ENV
          fi

      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔐 gradlew izni
        run: chmod +x ./gradlew

      - name: 🏗️ Release APK derle
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
        env:
          SIGNING_KEY_STORE_PATH: ${{ secrets.SIGNING_KEY_STORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: 🔍 APK kontrol
        run: |
          echo "=== Derlenen APK'lar ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 📤 Release APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-v${{ env.VERSION_NAME }}-release
          path: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 📤 Debug APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-v${{ env.VERSION_NAME }}-debug
          path: ${{ env.APP_MODULE }}/build/outputs/apk/debug/*.apk
          retention-days: 30
        if: always()

      - name: 🚀 GitHub Release oluştur
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "CODEX PRO v${{ env.VERSION_NAME }} — Build #${{ env.BUILD_NUM }}"
          body: |
            ## 🚀 CODEX PRO v${{ env.VERSION_NAME }} — Build #${{ env.BUILD_NUM }}

            **Tarih:** ${{ env.DATE }}
            **Branch:** ${{ github.ref_name }}

            ---

            ### ✨ v2.0.0 — TAM ARAYÜZ YENİDEN TASARIM

            #### 🎨 Yeni Tasarım (Codex Pro IDE)
            - 🗂️ **DrawerLayout sidebar** — Sol kaydırma navigasyonu (Dashboard, Sohbet, Kod Editörü, AI Market, Terminal, Dosyalar, Görevler, Sub Agt'lar, Veritabanı, API, Ayarlar, Kısayollar)
            - 🔝 **CODEX PRO header bar** — 🚀 Logo + v2.0.0 badge + üst sekme navigasyonu (Sohbet | Kod Editörü | AI Market | Ayarlar)
            - 🧠 **Dashboard** — Brain animasyonu, "Merhaba Muhammed 👋", aksiyon butonları, istatistik kartlar (Toplam Proje, Dosya, Kod Satırı, Çalışan Agent)
            - 📊 **Model Yöneticisi paneli** — GPT-4o, Claude 3.5 Sonnet, Claude 3 Haiku, GPT-4 Turbo, GPT Nano, Gemini 1.5 Pro, Mistral Large
            - 🤖 **Sub Agent Durumları** — Gerçek zamanlı agent progress barları
            - 🟢 **Status bar** — HAZIR | Proje: Code-ioPRO | Branch: main | 8 Agent Aktif

            #### 🌌 Deep Space Blue Tema
            - Ana arka plan: #07090F (çok koyu mavi-siyah)
            - Kart arka planı: #0F1627
            - Elektrik mavi accent: #1E64FF
            - Sidebar active: mavi sol border + highlight

            #### 💬 Chat Ekranı
            - 4 mod sekmesi: 🎙 Sesli · 💬 Sohbet · 💻 Kod · 🧠 AI
            - Kompakt model seçici pill (ekranı kaplamaz)
            - DuckDuckGo referansları tamamen kaldırıldı

            #### 🤖 AI Market
            - Gerçek sağlayıcı logoları (OpenAI, Anthropic, Gemini, Groq, Mistral...)
            - Arama çubuğu + gelişmiş filtreler

            #### 🔧 Sistem
            - Sistem promptu düzeltildi: geliştirici = Muhammed, uygulama = CODEX PRO
            - versionCode: 17 → 20 / versionName: 1.3.0 → 2.0.0
            - DrawerLayout bağımlılığı eklendi

            ---

            ### 📱 Kurulum
            APK dosyasını cihaza indirin → **Bilinmeyen kaynaklara izin ver** → Kur

          files: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
