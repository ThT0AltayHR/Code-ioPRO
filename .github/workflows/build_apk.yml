name: Code-ioPRO — Stabil Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build türü'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]

env:
  APP_MODULE: app
  APP_NAME: Code-ioPRO

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Tarih değişkeni ────────────────────────────────────────────
      - name: 📅 Tarih değişkeni
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # ── 3. JDK 17 ─────────────────────────────────────────────────────
      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 4. Gradlew izni ───────────────────────────────────────────────
      - name: 🔐 gradlew izni
        run: chmod +x ./gradlew

      # ── 5. Gradle cache ───────────────────────────────────────────────
      - name: 📦 Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 6. İmzalama Anahtarı Hazırla ─────────────────────────────────
      # GitHub Secret olarak SIGNING_KEY (base64 .jks) eklenmişse kullanılır.
      # Yoksa CI için otomatik test keystore üretilir.
      - name: 🔑 İmzalama keystore hazırla
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "✅ GitHub Secrets'tan keystore kullanılıyor"
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > /tmp/release.jks
            echo "SIGNING_KEY_STORE_PATH=/tmp/release.jks"           >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}"  >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "⚠️  SIGNING_KEY secret bulunamadı — CI test keystore oluşturuluyor"
            keytool -genkey -v \
              -keystore /tmp/release.jks \
              -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass codeio2024 -keypass codeio2024 \
              -dname "CN=Code-ioPRO CI, OU=Dev, O=CodeioPRO, L=TR, S=TR, C=TR" \
              2>/dev/null
            echo "SIGNING_KEY_STORE_PATH=/tmp/release.jks" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=codeio2024"        >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=release"                >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=codeio2024"          >> $GITHUB_ENV
          fi

      # ── 7. Release APK derle ──────────────────────────────────────────
      - name: 🏗️ Release APK derle
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          SIGNING_KEY_STORE_PATH: ${{ env.SIGNING_KEY_STORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ env.SIGNING_KEY_PASSWORD }}

      # ── 8. Debug APK derle (yedek) ────────────────────────────────────
      - name: 🔧 Debug APK derle
        run: ./gradlew assembleDebug --no-daemon
        if: always()

      # ── 9. APK bilgisi ────────────────────────────────────────────────
      - name: 📋 APK bilgisi
        run: |
          echo "=== Derlenen APK'lar ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # ── 10. Release APK yükle ─────────────────────────────────────────
      - name: 📤 Release APK yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-release-APK
          path: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          retention-days: 90

      # ── 11. Debug APK yükle ───────────────────────────────────────────
      - name: 📤 Debug APK yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATE }}-${{ env.APP_NAME }}-debug-APK
          path: ${{ env.APP_MODULE }}/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── 12. GitHub Release oluştur (sadece main/master push) ──────────
      - name: 🚀 GitHub Release oluştur
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Code-ioPRO v1.1.0 — Build #${{ github.run_number }}"
          body: |
            ## 🚀 Code-ioPRO Stabil Release

            **Derleme:** #${{ github.run_number }}
            **Tarih:** ${{ env.DATE }}
            **Branch:** ${{ github.ref_name }}

            ### ✅ Bu build'de düzeltilen kritik hatalar:
            - `NoClassDefFoundError: ReportFragment$ActivityInitializationListener` çöküşü düzeltildi
            - `biometric:1.2.0-alpha05` → stabil `1.1.0` sürümüne geçildi (lifecycle çakışması giderildi)
            - `lifecycle-runtime:2.8.7` explicit tanımlanarak versiyon çakışması engellendi
            - ProGuard kuralları kapsamlı biçimde yeniden yazıldı (WebView JS bridge, Room, Biometric, Lifecycle)
            - Release build `shrinkResources` aktif edildi
            - İmzalama CI/CD ortamına entegre edildi

            ### 📱 Kurulum:
            APK'yı cihaza indirip **Bilinmeyen kaynaklara izin ver** seçeneğiyle kurun.
          files: ${{ env.APP_MODULE }}/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
