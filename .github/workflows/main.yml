name: Code-ioPRO — Build & Release APK

env:
  main_project_module: app
  app_name: Code-ioPRO

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release)'
        required: false
        default: 'debug'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📅 Set date variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: ☕ Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔐 Grant permissions to gradlew
        run: chmod +x ./gradlew

      - name: 📦 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔍 Run lint checks
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }}-${{ env.app_name }}-debug-APK
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📋 APK Info
        run: |
          echo "=== Build Summary ==="
          echo "App: ${{ env.app_name }}"
          echo "Date: ${{ env.date_today }}"
          echo "Branch: ${{ github.ref_name }}"
          find ${{ env.main_project_module }}/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
