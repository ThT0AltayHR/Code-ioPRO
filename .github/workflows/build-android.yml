name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Run Expo Prebuild (Android)
        working-directory: artifacts/codex-pro
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Make Gradlew executable
        working-directory: artifacts/codex-pro/android
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Keystore (if not present)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkey -v \
            -keystore codex-pro-release.keystore \
            -alias codex-pro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=CODEX PRO, OU=Mobile, O=CodexPro, L=Istanbul, S=Istanbul, C=TR"
          echo "KEYSTORE_PATH=$(pwd)/codex-pro-release.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android123" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android123" >> $GITHUB_ENV
          echo "KEY_ALIAS=codex-pro" >> $GITHUB_ENV

      - name: Setup Keystore from Secret
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > codex-pro-release.keystore
          echo "KEYSTORE_PATH=$(pwd)/codex-pro-release.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        working-directory: artifacts/codex-pro/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password=${{ env.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ env.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ env.KEY_PASSWORD }}

      - name: Find APK
        run: |
          APK=$(find artifacts/codex-pro/android -name "*.apk" -path "*/release/*" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "Found APK: $APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CODEX-PRO-v2.0.0-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: "CODEX PRO v2.0.0 Build #${{ github.run_number }}"
          body: |
            ## CODEX PRO v2.0.0

            ### Özellikler
            - 🤖 DuckDuckGo AI entegrasyonu (GPT-4o, Claude, Gemini, Mistral)
            - 🎤 Sesli sohbet desteği (duck.ai)
            - 💻 Syntax highlighted kod editörü
            - 🌙 Dark theme arayüz
            - 📱 Tüm Android telefon boyutlarıyla uyumlu

            ### Kurulum
            1. APK dosyasını indirin
            2. Bilinmeyen kaynaklara izin verin (Ayarlar → Güvenlik)
            3. APK'yı kurun

            Built with ❤️ using Expo + DuckDuckGo AI
          files: ${{ env.APK_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
